# 三路深渊排队插件配置
#
# 全部字段都有默认值，只需按本机/服务器实际情况修改。

# ------------------------------------------------------------------
# 数据来源：云端编辑器（部署在服务器上）。插件**只读**它，不写任何表。
# 机器人按 ttl_ms 从 <url>/api/snapshot?k=<token> 拉一份 xlsx 快照解析出数据。
# 本机联调可以把 url 指到 http://127.0.0.1:7788（本机编辑器）。
# ------------------------------------------------------------------
remote:
  url: ${remote_url}             # 云端编辑器地址，例：https://example.com/queue
  token: ${remote_token}         # 编辑器用的就是这一份（宿主注入给它）；会出现在每个人的链接里。改完要重启机器人
  # 身份签名密钥：编辑器用的就是这一份，**必须与访问口令不同**。
  # 留空或与口令相同 → 编辑器拒绝启动（宿主因此不挂载，bot 照常跑）；
  # 只有本机联调（回环地址 + ABYSS_EDITOR_TEST_PATHS=1）才允许退回用口令签。生成：openssl rand -hex 24
  sign_key: ${remote_sign_key}
  # 管理口令：编辑器页面上打开 `?a=<这段>` 就是「主人」身份，用于维护白名单的备用入口。
  # 留空 = 不开这个入口；非空时必须与访问口令、签名密钥都不同。改完同样要重启机器人。
  admin_token: ${remote_admin_token}
  # 群里发短链：<url>/s/<16 字符码>?t=<签发分钟>&ts=<签名>&n=<群昵称>（码不透明，编辑器验过后换成带身份的完整地址；
  #   ?t&ts 是机器人签的签发时刻，认领层用它判"谁手里那条更新"——主人重发一次 #排队 就能抢回写权限；
  #   ?n 是发送者当时的群昵称，给编辑器兜底（它的群名单每天才推一次，名单里还没这个人时才用得上）。三段共用一段签名）。
  # 编辑器要同时更新（本仓库同一份代码）；云端还没更新时改成 false，退回长链接。
  short_link: ${remote_short_link}
  # 填报入口做成「点此填表」四个字本身可点（QQ 的 markdown 段）。
  # 默认关：多数群/账号不认机器人发的 markdown（实测 NTQQ 回「发送者版本过低」），
  # 虽然会自动退回纯文本链接，但每次都要先失败一次。确认能用再打开。
  link_markdown: ${remote_link_markdown}
  ttl_ms: ${remote_ttl_ms}       # 内存快照有效期：这期间连续命令不再重复拉取
  timeout_ms: ${remote_timeout_ms}   # 单次拉取超时
  # 本机联调兜底（可选）：拉不到时把这个脚本跑起来等几秒再试。**插件不生成它**，
  # 路径由维护者自己准备；按扩展名挑解释器（.mjs/.js/.cjs 用 node、.cmd/.bat 用 cmd.exe、.vbs 用 wscript）。
  # 例：<Yunzai>/plugins/abyss-queue/data/launch-editor.cmd（数据目录固定在插件内）；正式部署留空
  autostart: ${remote_autostart}

# ------------------------------------------------------------------
# 云端快照的本地备份：数据以云端为准，每次成功拉取都往本地写一份（**默认开启**）
# 按日期命名覆盖写，只留最近几份（份数是代码里的常量，不开放配置）
# 落点固定 `<插件根>\data\backup`（**不可配置**：数据一律留在插件目录内）
# enable: false 才关掉它
# （别和编辑器写表前的 .bak 混了：那个由编辑器自己管，不在本文件里配）
# ------------------------------------------------------------------
snapshot_backup:
  enable: ${snapshot_backup_enable}

# ------------------------------------------------------------------
# 群号（**都是可以自己改的**，改完即生效——这两项走热重载，不用重启）
#
#   1) notify.groups —— 「上一位完成后 @ 下一位」「榜开启提醒」「月末 @ 所有排队中的人」发到哪些群
#        可以写多个：groups: [123456789, 987654321]
#        留空 = 这些 @ 通知都不发；想明确关掉并免掉"没配群号"的提示，设 notify.enable: false
#   2) roster.group  —— 从这个群拉成员名单，做「群昵称候选」+ 按 QQ 对账（改名同步 / 退群删行）
#        只能填一个群；留空 = 关闭群名单（编辑器里就没有候选）
#
#   两者可以是不同的群：比如名单从主群拉，通知发到通知群。
# ------------------------------------------------------------------

# 群成员名单：机器人每天（启动时也推一次）把群成员推给在线编辑器
roster:
  group: ${roster_group}         # 群号，例：123456789（填了才启用；换群号直接改这里）
  at: ${roster_at}               # 每天到这个时刻推一次（本地时间；到点之后一整天都算数）

# 通知：完成情况轮询 / 榜开启提醒 / 月末催办 / 群成员名单同步
#
# **只注册一条定时任务**（cron 就是下面的 notify.cron，默认每 3 分钟），
# 四件事都由它在内部按时间判断依次做，各自去重（重启、重复 tick 都不会重复发）。
# 上面那几个时刻是"到点之后一整天都算数"：机器人半夜关着、早上才起来也会补做一次。
notify:
  enable: ${notify_enable}                    # 总开关：false = 三条 @ 通知全关（名单同步不受影响）
  groups: ${notify_groups}                    # 三条 @ 通知发到哪些群，例：[123456789]；留空 = 不发
  cron: ${notify_cron}                        # 唯一那条任务的周期
  monthly_at: ${notify_monthly_at}            # 月末催办的时刻（每月最后一天）
  monthly_enable: ${notify_monthly_enable}    # false = 不做月末催办（开榜提醒与完成轮询不受影响）
  # 状态文件固定 `<插件根>\data\progress.json`（不可配置：数据一律留在插件目录内），
  # 里面装着进度快照 + 每榜开启标记 + 当天已做的标记

# 默认榜：`#排队 全部` 不带榜名时使用
default_sheet: ${default_sheet}

# 列表显示条数（图片模式下即最大行数；0 = 全部）
list_limit: ${list_limit}

# 是否用图片渲染队列 / 主播 / 菜单（渲染后端不可用时自动回退为文本）
render_image: ${render_image}

# 出图分辨率倍数（设备像素比）：2 = 两倍宽高的高清图，字号与版式不变
# 本插件把该值下发成渲染链的 `data.sys.scale`；渲染后端不认它时出图仍是 1 倍（820px 宽）
render_scale: ${render_scale}

# 图片模式下每列的截断宽度（按显示宽度计，中文算 2；0 = 不截断）
# 「群昵称」与「帮帮完成情况」两列共用它；名单只显示「序号 / 成员 / 完成情况」三列，
# 本人信息单独完整给出
render_max: ${render_max}

# 字体**没有配置项**：原神标准字体（汉仪文黑-65W）随源码分发，在 resources/common/font/ 下，
# 与 Axiu-Plugin / Atlas-Plugin 同位置同文件；渲染模板直接以 file:// 引用它，不下载、不缓存。

# 主播别名：正名 → 别名（按正则整串匹配、忽略大小写）
# 表里/群里对同一位主播的其它写法（老昵称、简称）登记在这里，读的时候会归一成正名：
#   #主播 阿修 能查到 阿修Axiu；表里写「璃月第一深情」的行也算作摸头妹（直播入口照样带出来）
# 写成**单行映射**（多行形式会被锅巴保存归一成一行，那样三份的行数就对不上了）
anchor_aliases: ${anchor_aliases}

# ------------------------------------------------------------------
# 编辑器页脚：**自定 HTML**
#
# 版权、备案号这些由维护者自己决定怎么排版，所以这里不拆字段、也不做校验：
#   footer.html 里的内容会被**原样插进页面**（编辑器首页 + 三个提示页：需要口令 / 仅主人可用 / 链接已失效）。
# 留空 = 不显示页脚（整块不渲染）。填什么自己负责——它只由维护者维护，不会读群友输入。
#
# 备案号自己往后接，例如（官方链接是硬要求，自己拼进去）：
#   <div><a href="https://beian.miit.gov.cn/" target="_blank" rel="noreferrer">京ICP备2026xxxxxx号-1</a></div>
#   <div><a href="https://beian.mps.gov.cn/#/query/webSearch?code=1101xxxxxxxxxx" target="_blank" rel="noreferrer">京公网安备1101xxxxxxxxxx号</a></div>
#
# 编辑器读的是**运行时的 config/config.yaml**；改完要重启机器人（页脚是在插件加载时取走的）。
# ------------------------------------------------------------------
footer:
  # 首行署名（`&` 用实体 `&amp;` 更稳；要改署名直接编辑这一行）
  # **多行就直接换行**（锅巴保存时会写成单行 YAML 的 \n 转义）；别手打 `\n` 这两个字符——那会原样显示出来。
  html: ${footer_html}

# ------------------------------------------------------------------
# 数据落点：**不可配置**
#
# 绑定（`data/bindings.json`）、进度快照（`data/progress.json`）、快照备份（`data/backup`）、
# 编辑器白名单（`data/abyss-editor-admins.json`）、私聊链接状态（`data/manager-link.json`）、
# 群成员名单缓存（`data/roster.json`，机器人侧留一份最近扫成功的名单，@ 人用）
# 与重启标记（`data/restart.flag`，进程退出时写下；维护者自己的启动脚本可据此判断这次是重启还是停服）
# 都固定长在 `<插件根>\data` 下——数据一旦落到插件外面，`#更新 abyss`（只动代码）与备份/迁移
# 就会各按各的路径找，哪一份都不是完整的。所以这里**故意没有路径配置项**。
# 回归套件要重定向，走 `ABYSS_QUEUE_STORE_FILE` / `_STATE_FILE` / `_BACKUP_DIR` / `_ADMINS_FILE` /
# `_MANAGER_LINK_FILE` / `_RESTART_FLAG` / `_XLSX_PATH` 环境变量 + `ABYSS_QUEUE_TEST_PATHS=1`；
# 生产不设任何 `ABYSS_QUEUE_*` 路径变量。
# ------------------------------------------------------------------

# ------------------------------------------------------------------
# 生效时机：改完**不用重启机器人**
#
# 插件盯着 `config/config.yaml`，一改就热重载（锅巴保存、手工编辑、#排队初始化 写密钥都算），
# 日志里会打一行「配置已热重载」。**唯一例外是 notify.cron**：它决定唯一那条定时任务的周期，
# 那条 cron 是在插件实例化时交给框架的，改动要重启才生效。
# ------------------------------------------------------------------
