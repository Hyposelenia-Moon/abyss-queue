<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>排队表</title>
<link rel="icon" href="__MOUNT__/favicon.ico" />
<style>
:root{
  --ink:#1f2a3a;--muted:#7b8698;--line:rgba(30,45,80,.1);--blue:#1b3a8f;
  --glass:linear-gradient(160deg,rgba(255,255,255,.72),rgba(255,255,255,.42));
  --shadow:0 16px 40px rgba(24,36,60,.12);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;color:var(--ink);
  font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  background:
    radial-gradient(900px 620px at 6% -8%,rgba(236,214,183,.42),transparent 62%),
    radial-gradient(980px 640px at 102% -6%,rgba(196,214,248,.5),transparent 64%),
    radial-gradient(760px 520px at 50% 110%,rgba(206,226,218,.34),transparent 66%),
    #eef2f8;
}
button{font:inherit}
.side{position:fixed;inset:16px auto 16px 16px;width:220px;padding:20px 16px;border-radius:18px;
  background:linear-gradient(170deg,rgba(255,255,255,.82),rgba(255,255,255,.46));
  border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow);backdrop-filter:blur(18px);
  display:flex;flex-direction:column;gap:18px;z-index:10}
.brand b{font-size:22px;letter-spacing:.06em;display:block}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.12em}
.nav{display:flex;flex-direction:column;gap:4px}
.nav .g{font-size:10.5px;color:#a2abbb;letter-spacing:.14em;margin:10px 0 2px;padding-left:8px}
.nav button{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:#4b5668;
  padding:8px 10px;border-radius:9px;cursor:pointer;text-align:left;font-size:13px}
.nav button.on,.nav button:hover{background:rgba(255,255,255,.78);color:var(--blue);box-shadow:0 4px 14px rgba(24,36,60,.08)}
.nav .n{margin-left:auto;font-family:"Times New Roman",serif;font-size:12px;color:#8b94a8}
.me{margin-top:auto;font-size:11px;color:var(--muted);line-height:1.6}
.main{margin-left:252px;margin-right:24px;padding:16px 0 30px;max-width:1600px}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;
  background:var(--glass);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow);backdrop-filter:blur(16px)}
.crumb{font-size:13px;color:#4b5668;display:flex;gap:7px;align-items:center}
.crumb b{color:#1b2433}
.gap{flex:1}
.btn{height:32px;padding:0 12px;border-radius:9px;border:1px solid rgba(30,45,80,.12);
  background:rgba(255,255,255,.66);color:#33415c;cursor:pointer;font-size:12px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.tag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;
  background:rgba(229,196,146,.2);border:1px solid rgba(180,140,80,.16);color:#7a5a2e;font-size:11.5px}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0}
.tab{display:flex;align-items:center;gap:10px;height:54px;padding:0 16px;border-radius:14px;
  border:1px solid rgba(255,255,255,.95);background:var(--glass);box-shadow:0 10px 26px rgba(24,36,60,.08);
  cursor:pointer;font-size:14px;color:#3b4557}
.tab.on{background:rgba(255,255,255,.96);box-shadow:0 0 0 2px var(--blue),0 12px 30px rgba(27,58,143,.14);color:#18233a}
.tab i{width:7px;height:7px;border-radius:50%;background:var(--blue);font-style:normal}
.tab .n{margin-left:auto;font-family:"Times New Roman",serif;font-size:15px;color:#59657a}
.tip{font-size:12px;color:#6b7590;padding:9px 14px;border-radius:11px;background:rgba(255,255,255,.5);
  border:1px solid rgba(255,255,255,.85);margin-bottom:12px}
.anchors{padding:14px 16px 16px;border-radius:18px;background:var(--glass);border:1px solid rgba(255,255,255,.9);
  box-shadow:var(--shadow);backdrop-filter:blur(18px);margin-bottom:14px}
.anchors h2{font-size:16px;margin:0 0 10px;display:flex;align-items:baseline;gap:10px}
.anchors h2 em{font-style:normal;font-size:11px;color:var(--muted);font-weight:400}
.acards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.acard{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.95);
  box-shadow:0 10px 24px rgba(24,36,60,.08);display:flex;flex-direction:column;gap:7px}
.atop{display:flex;align-items:center;gap:8px;min-width:0}
.atop b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{margin-left:auto;color:#b98f43;font-size:11px;letter-spacing:1px;white-space:nowrap}
.ameta{font-size:11.5px;color:var(--muted);line-height:1.5}
.abot{display:flex;align-items:center;gap:8px;margin-top:2px}
.aq{font-size:11.5px;color:#5b6577;white-space:nowrap}
.acall{margin-left:auto;height:26px;padding:0 10px;border-radius:8px;border:1px solid rgba(27,58,143,.18);
  background:rgba(27,58,143,.06);color:var(--blue);font-size:11.5px;cursor:pointer;white-space:nowrap}
.acall:disabled{opacity:.45;cursor:not-allowed}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.panel{border-radius:18px;background:var(--glass);border:1px solid rgba(255,255,255,.95);
  box-shadow:var(--shadow);backdrop-filter:blur(20px);overflow:hidden}
.bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.bar h2{font-size:19px;margin:0;font-weight:600}
.bar .sub{font-size:11.5px;color:var(--muted)}
.bar .gap{flex:1}
.tablewrap{overflow:auto}
table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
th{font-size:11.5px;color:#7b8698;font-weight:500;letter-spacing:.02em;text-align:left;
  padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px dashed rgba(30,45,80,.07);vertical-align:middle;font-size:13px}
tbody tr:hover td{background:rgba(27,58,143,.035)}
th:nth-child(1),td:nth-child(1){width:5%}
th:nth-child(2),td:nth-child(2){width:20%}
th:nth-child(3),td:nth-child(3){width:12%}
th:nth-child(4),td:nth-child(4){width:14%}
th:nth-child(5),td:nth-child(5){width:16%}
th:nth-child(6),td:nth-child(6){width:12%}
th:nth-child(7),td:nth-child(7){width:13%}
th:nth-child(8),td:nth-child(8){width:8%}
td input,td textarea{width:100%;border:0;background:transparent;font:inherit;color:inherit;padding:4px 2px;outline:0}
td input:focus,td textarea:focus{background:rgba(255,255,255,.85);box-shadow:0 0 0 1px rgba(27,58,143,.25);border-radius:6px}
.cell{margin:0;-webkit-appearance:none;appearance:none;display:inline-flex;align-items:center;gap:6px;
  border:1px solid rgba(30,45,80,.12);background:rgba(255,255,255,.7);padding:6px 10px;border-radius:9px;
  font:inherit;font-size:12.5px;color:#33415c;cursor:pointer;min-height:30px;text-align:left;max-width:100%}
.cell .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell:disabled{cursor:default;opacity:.75}
.pill{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;
  border:1px solid rgba(30,45,80,.1);background:rgba(255,255,255,.72);font-size:11.5px;color:#4b5668}
.pill.queued{color:#1d5fd0;background:rgba(238,243,253,.9);border-color:#d7e3f8}
.pill.waiting{color:#a8641c;background:rgba(253,243,228,.9);border-color:#f2e0c8}
.pill.done{color:#2b7a4b;background:rgba(233,247,239,.9);border-color:#cde9d8}
td.call{text-align:right}
.callbtn{height:30px;padding:0 10px;border-radius:8px;border:1px solid rgba(27,58,143,.18);
  background:rgba(27,58,143,.06);color:var(--blue);font-size:12px;cursor:pointer}
.callbtn:disabled{opacity:.4;cursor:not-allowed}
.rail{display:flex;flex-direction:column;gap:14px}
.done{padding:14px 16px;border-radius:18px;background:var(--glass);border:1px solid rgba(255,255,255,.95);box-shadow:var(--shadow)}
.done .dh{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.done .dh b{font-size:19px}
.done .dh em{font-style:normal;font-size:11.5px;color:var(--muted)}
.done .dh .pct{margin-left:auto;color:#2f6e4e;font-family:"Times New Roman",serif;font-size:22px}
.done .bar2{height:4px;border-radius:99px;background:rgba(30,45,80,.08);overflow:hidden;margin-bottom:8px}
.done .bar2 i{display:block;height:100%;background:#2f6e4e}
.drow{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed rgba(30,45,80,.07);font-size:12px}
.drow:first-of-type{border-top:0}
.drow .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.drow .by{max-width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#7b8698}
.drow .undo{flex:none;height:24px;padding:0 8px;border-radius:7px;border:1px solid var(--line);background:rgba(255,255,255,.7);font-size:11px;color:#5b6580;cursor:pointer}
.empty{color:#8b94a8;font-size:12px;padding:14px 0}
.savestate{font-size:12px;color:#7b8698;min-width:64px;text-align:right}
.savestate.bad{color:#a53c2e}
.foot{max-width:1180px;margin:18px auto 0;text-align:center;color:#7b8698;font-size:11.5px;line-height:1.7}
.picker{position:fixed;z-index:50;min-width:180px;max-width:320px;padding:6px;background:#fff;border:1px solid var(--line);
  border-radius:10px;box-shadow:0 16px 36px rgba(27,36,70,.2);display:none}
.picker.open{display:block}
.picker .opt{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:7px 8px;
  border-radius:7px;font-size:12.5px;color:#33415c;cursor:pointer;text-align:left}
.picker .opt:hover,.picker .opt.on{background:#eef2fb}
.picker .opt .tick{margin-left:auto;color:#2f9a5e;font-weight:700}
.picker .hd{font-size:11px;color:#8b94a8;padding:4px 8px}
.toast{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast div{background:rgba(35,43,64,.92);color:#fff;padding:9px 12px;border-radius:10px;font-size:12px;max-width:360px}
@media (max-width:1200px){
  .acards{grid-template-columns:repeat(3,minmax(0,1fr))}
  .wrap{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:820px){
  .side{display:none}
  .main{margin:10px;padding:0 0 20px}
  .tabs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .acards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tablewrap{overflow:auto}
  table{min-width:860px}
}

@media (max-width:820px){
  .tablewrap{overflow:visible}
  table{min-width:0}
  #grid thead{display:none}
  #grid tbody tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 2px;border-bottom:1px dashed rgba(30,45,80,.08)}
  #grid tbody td{display:none;border:0;padding:0;height:auto}
  #grid tbody td:nth-child(2){display:block;grid-column:1;grid-row:1;min-width:0}
  #grid tbody td:nth-child(2) input{font-weight:600;border:0;background:transparent;padding:0}
  #grid tbody td:nth-child(7){display:block;grid-column:2;grid-row:1;justify-self:end}
  #grid tbody td:nth-child(1){display:block;grid-column:1;grid-row:2;color:#8c96a6;font-size:11px}
  #grid tbody td:nth-child(8){display:block;grid-column:2;grid-row:2;justify-self:end}
  .wrap{grid-template-columns:minmax(0,1fr)}
  .rail{margin-top:12px}
  .donecol,.done{max-height:none;height:auto}
  .tablefoot .hint{display:none}
  .tablefoot{flex-wrap:wrap}
}
.medit{display:none}
@media (max-width:820px){ .medit{display:inline-flex;margin-top:4px;border:1px solid rgba(27,58,143,.18);background:rgba(27,58,143,.05);color:#1b3a8f;border-radius:6px;font-size:11px;padding:2px 8px} }
#msheet{position:fixed;inset:0;background:rgba(18,28,46,.28);display:none;align-items:flex-end;z-index:85}
#msheet.on{display:flex}
.msbox{width:100%;background:#fff;border-radius:18px 18px 0 0;padding:16px 16px 20px;max-height:86vh;overflow:auto;box-shadow:0 -18px 50px rgba(20,32,60,.22)}
.msbox h3{margin:0;font-size:16px}
.msrow{display:flex;flex-direction:column;gap:5px;margin:12px 0}
.msrow label{font-size:11px;color:#7b8698}
.msrow input{height:36px;border-radius:9px;border:1px solid rgba(30,45,80,.16);padding:0 10px;font-size:14px}
.msrow .cell{height:36px;border-radius:9px;justify-content:space-between;padding:0 10px}
.msclose{width:100%;height:40px;border-radius:10px;border:1px solid rgba(27,58,143,.2);background:rgba(27,58,143,.06);color:#1b3a8f;font-size:14px;margin-top:8px}
.mshead{display:flex;align-items:center;justify-content:space-between}
.mshead button{border:0;background:transparent;font-size:22px;color:#7b8698}

#panelMask{position:fixed;inset:0;background:rgba(18,28,46,.28);display:none;align-items:center;justify-content:center;z-index:80;backdrop-filter:blur(3px)}
#panelMask.on{display:flex}
.panelbox{width:min(780px,92vw);max-height:82vh;overflow:auto;background:linear-gradient(150deg,rgba(255,255,255,.96),rgba(255,255,255,.86));border:1px solid rgba(255,255,255,.95);border-radius:18px;box-shadow:0 26px 70px rgba(20,32,60,.24);padding:18px 22px 20px}
.panelbox h2{margin:0;font-size:20px;font-weight:700;color:#1f2a3a}
.panelbox .ph{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.panelbox .ph button{margin-left:auto;border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer;color:#7b8698}
.prow{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid rgba(30,45,80,.07);font-size:13px;color:#2b3648}
.prow:last-child{border-bottom:0}
.prow .t{color:#7b8698;font-variant-numeric:tabular-nums}
.prow .g{margin-left:auto;color:#7b8698}
.prow button{border:1px solid rgba(27,58,143,.22);background:rgba(27,58,143,.06);color:#1b3a8f;border-radius:7px;padding:4px 9px;font-size:12px;cursor:pointer}
.pempty{padding:22px 0;text-align:center;color:#8c96a6;font-size:13px}

.tablefoot{display:flex;align-items:center;gap:10px;padding:10px 14px 2px;color:#7b8698;font-size:12px}
.tablefoot button{border-radius:8px;border:1px solid rgba(30,45,80,.16);background:rgba(255,255,255,.7);padding:6px 12px;font-size:12px;cursor:pointer}
.tablefoot button.danger{color:#b23b3b;border-color:rgba(178,59,59,.25)}
.tablefoot button:disabled{opacity:.45;cursor:not-allowed}
.tablefoot .hint{margin-left:auto}
tr.sel td{background:rgba(27,58,143,.06)}


@media (max-width:820px){
  html,body{max-width:100%;overflow-x:hidden}
  .main{margin:0 !important;padding:12px 12px 24px !important;max-width:none !important}
  .top{flex-wrap:wrap;gap:6px}
  .top .crumb{font-size:12px;min-width:0}
  .top .tag{display:none}
  .top .btn{height:30px;font-size:12px;padding:0 10px}
  .tabs{grid-template-columns:1fr 1fr !important;gap:8px}
  .acards{grid-template-columns:1fr !important}
  .acard{min-width:0}
  .panel,.rail{min-width:0}
  .tablewrap{width:100%;overflow-x:hidden}
  #grid{width:100%;table-layout:auto}
  #grid tbody tr{width:100%;box-sizing:border-box}
  #grid tbody td:nth-child(2) input{width:100%}
  .tablefoot{width:100%}
}


@media (max-width:820px){
  .main{width:100%;box-sizing:border-box}
  .top{max-width:100%;overflow:hidden;box-sizing:border-box}
  .top .crumb{white-space:normal;overflow:hidden;min-width:0}
  #savedAt{display:none}
  .tabs{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
  .tabs .tab{min-width:0;overflow:hidden}
  .acards{grid-template-columns:minmax(0,1fr) !important}
  .acard{min-width:0;overflow:hidden}
}


@media (max-width:820px){
  #grid{width:100%;max-width:100%;overflow:hidden}
  #grid table{width:100% !important;max-width:100%;min-width:0 !important}
  #grid tbody tr{grid-template-columns:minmax(0,1fr) 118px !important;overflow:hidden}
  #grid tbody td{min-width:0;overflow:hidden}
  #grid tbody td:nth-child(7) .chips{flex-wrap:wrap;gap:4px}
  #grid tbody td:nth-child(7) .chip{max-width:100%;font-size:11px;padding:3px 8px}
  #grid tbody td:nth-child(8){display:none !important}
  #grid tbody td:nth-child(7){display:none !important}
}
.goal2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:6px}
.gh{font-size:11px;color:#7b8698;padding:2px 8px 6px}
.goal2 .opt{width:100%}
</style>
</head>
<body>
<aside class="side" id="side">
  <div class="brand"><b>排队表</b><span>PC · 管理台</span></div>
  <nav class="nav">
    <div class="g">数据</div>
    <button class="on" data-nav="queue">排队表<span class="n" id="navCount">0</span></button>
    <div class="g">面板</div>
    <button data-nav="versions">历史版本</button>
    <button data-nav="changes">改动记录</button>
    <button data-nav="admins">权限管理</button>
    <button data-nav="ownership">归属状态</button>
    <button data-nav="cloud">云端同步</button>
  </nav>
  <div class="me" id="me">加载中…</div>
</aside>

<main class="main">
  <header class="top">
    <div class="crumb"><b>排队表</b><span>·</span><span id="crumbTop">管理</span><span id="savedAt"></span></div>
    <span class="tag" id="syncTag">同步就绪</span>
    <div class="gap"></div>
    <button class="btn" id="reloadBtn">重新读取</button>
    <span class="savestate" id="saveState">已保存</span>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="tip" id="permTip"></div>

  <section class="anchors">
    <h2>主播区 <em>本榜可用 · 推荐度用原文</em></h2>
    <div class="acards" id="acards"></div>
  </section>

  <div class="wrap">
    <section class="panel">
      <div class="bar"><h2>排队中</h2><span class="sub" id="queueSub"></span><div class="gap"></div><span class="sub">点单元格直接改，改完自动保存</span></div>
      <div class="tablewrap"><table id="grid"><thead></thead><tbody></tbody></table></div>
  <div class="tablefoot">
    <button id="addRow" type="button">＋ 新增一行</button>
    <button id="delRow" class="danger" type="button" disabled>删除这一行</button>
    <span class="hint">点一行选中，点单元格直接改，改完自动保存</span>
  </div>
    </section>
    <aside class="rail">
      <section class="panel done">
        <div class="dh"><b>已完成</b><em id="doneCount"></em><span class="pct" id="donePct">0%</span></div>
        <div class="bar2"><i id="doneBar" style="width:0"></i></div>
        <div id="doneList"></div>
      </section>
    </aside>
  </div>
  <footer class="foot" id="foot"></footer>
</main>

<div class="picker" id="picker"></div>
<div id="msheet"><div class="msbox"><div class="mshead"><h3 id="msTitle">编辑</h3><button id="msClose" type="button">×</button></div><div id="msBody"></div><button class="msclose" id="msDone" type="button">收起</button></div></div>
<div id="panelMask"><div class="panelbox"><div class="ph"><h2 id="panelTitle"></h2><button id="panelClose" type="button">×</button></div><div id="panelBody"></div></div></div>
<div id="toast"></div>

<script nonce="__NONCE__">
window.addEventListener('error', ev => { const d=document.createElement('div'); d.className='toast'; d.style.cssText='position:fixed;left:20px;bottom:20px;z-index:99'; d.textContent='页面出错：'+(ev.message||'未知'); document.body.appendChild(d) });
(() => {
  const q = new URLSearchParams(location.search)
  const st = { meta:null, sheets:[], cur:0, readonly:false, dirty:new Map(), saving:false, timer:0 }
  const $ = id => document.getElementById(id)
  const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  const toast = msg => { const d=document.createElement('div'); d.textContent=msg; $('toast').appendChild(d); setTimeout(()=>d.remove(),3200) }
  let selectedRow = null
  const KEYS = {k:'abyss.k',u:'abyss.u',s:'abyss.s',a:'abyss.a'}
  for (const k of ['k','u','s','a']) if (q.get(k)) localStorage.setItem(KEYS[k], q.get(k))
  if (Object.keys(KEYS).some(k=>q.get(k))) history.replaceState(null,'',location.pathname)
  const headers = () => {
    const h={'x-abyss-device':localStorage.getItem('abyss.d')||''}
    const map={k:'x-abyss-token',u:'x-abyss-identity',s:'x-abyss-sign',a:'x-abyss-admin'}
    for(const [k,v] of Object.entries(KEYS)){const x=localStorage.getItem(v); if(x) h[map[k]]=x}
    return h
  }
  const api = async (path, init={}) => {
    const res = await fetch(path, {...init, headers:{...(init.headers||{}), ...headers()}})
    const text = await res.text()
    if (/^\s*</.test(text)) throw new Error('接口返回网页，链接可能失效')
    const data = text ? JSON.parse(text) : {}
    if (!res.ok) throw new Error(data.error || ('HTTP '+res.status))
    return data
  }
  const setState = (kind,text) => { const el=$('saveState'); el.textContent=text; el.className='savestate'+(kind==='bad'?' bad':'') }
  const sheet = () => st.sheets[st.cur]
  const fields = () => st.meta.fields
  const value = (row,key) => (st.dirty.get(row.row)?.values || row)[key] || ''

  function need(field,row){ return field.required && !String(value(row,field.key)).trim() }

  function load(){

    api('api/data').then(data => {
      st.meta=data; st.sheets=data.sheets||[]; st.readonly=!!(data.perm&&data.perm.readonly)
      st.cur=Math.min(st.cur,Math.max(0,st.sheets.length-1))
      $('me').textContent = (data.perm?.role||'访客') + ' · ' + (data.perm?.nick||'') + (st.readonly?' · 只读':'')
      $('permTip').textContent = st.readonly ? '只读身份：可以浏览，不能修改。' : '管理员：可以修改所有人的信息。'
      $('savedAt').textContent = data.savedAt ? '上次保存 ' + data.savedAt : ''
      renderTabs(); renderAll(); loadFooter();;;;
      setState('','已保存')
    }).catch(e=>{ setState('bad','读取失败：'+e.message); toast('读取失败：'+e.message) })
  }

  function renderTabs(){
    $('tabs').innerHTML = st.sheets.map((s,i)=>{
      return `<button class="tab ${i===st.cur?'on':''}" data-tab="${i}"><i></i>${esc(s.title)}<span class="n">${s.rows.length||0}</span></button>`
    }).join('')
    $('tabs').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ if(st.dirty.size && !confirm('当前改动尚未保存，切换后会丢失，继续？')) return; st.cur=Number(b.dataset.tab); st.dirty.clear(); renderTabs(); renderAll() })
  }

  function isDone(status){ const v=String(status||'').trim(); if(!v) return false; if(/已完成/.test(v)) return true; if(/等待开启|排队中/.test(v)) return false; return !['排队中','等待开启'].includes(v) }

  function renderAll(){ renderAnchors(); renderTable(); renderDone(); renderMeta() }

  function renderMeta(){ const s=sheet(); if(!s) return; $('queueSub').textContent = s.rows.filter(r=>!isDone(r.status)).length + ' 人'; $('navCount').textContent = s.rows.filter(r=>!isDone(r.status)).length }

  function renderAnchors(){
    const s=sheet(); if(!s){$('acards').innerHTML='';return}
    const list=(s.anchorRows||[]).map(a=>card(a))
    if(s.publicQueue) list.push(card({name:s.publicQueue.name,recommend:'公共队',skills:'不挑主播',queued:s.publicQueue.queued,done:0,isPublic:true}))
    $('acards').innerHTML = list.join('')
    $('acards').querySelectorAll('[data-acall]').forEach(b=>b.onclick=()=>callAnchor(Number(b.dataset.acall)))
  }

  function card(a){

    const call = a.isPublic ? '' : `<button class="acall" ${a.callable?'':'disabled'} title="${esc(a.callReason||'')}" data-acall="${a.row}">呼叫</button>`
    return `<div class="acard"><div class="atop"><b>${esc(a.name)}</b>${stars}</div>
      <div class="ameta">${esc(a.skills||'—')}</div>
      <div class="abot"><span class="aq">排队 ${a.queued||0} · 完成 ${a.done||0}</span>${call}</div></div>`
  }
  const starsOf = r => /强烈/.test(r)?5:/提分/.test(r)?4:/可选/.test(r)?3:0

  function renderTable(){
    const s=sheet(); if(!s) return
    const rows=s.rows.filter(r=>!isDone(r.status))
    $('grid').querySelector('thead').innerHTML = '<tr><th>序号</th><th>群昵称</th><th>原神游戏名</th><th>选择主播</th><th>难度及目标</th><th>备注</th><th>排队状态</th><th>呼叫</th></tr>'
    $('grid').querySelector('tbody').innerHTML = rows.map((r,i)=>{
      const dv = k => value(r,k)
      return `<tr data-row="${r.row}">
        <td>${esc(r.seq||i+1)}</td>
        <td><input data-edit="nickname" value="${esc(dv('nickname'))}" ${st.readonly?'disabled':''}><button type="button" class="medit" data-medit="${r.row}">编辑</button></td>
        <td><input data-edit="gameName" value="${esc(dv('gameName'))}" ${st.readonly?'disabled':''}></td>
        <td><button class="cell" data-pick="anchor" ${st.readonly?'disabled':''}><span class="v">${esc(dv('anchor')||'选择主播')}</span><span>▾</span></button></td>
        <td><button class="cell" data-pick="goal" ${st.readonly?'disabled':''}><span class="v">${esc(dv('goal')||'难度及目标')}</span><span>▾</span></button></td>
        <td><input data-edit="note" value="${esc(dv('note'))}" ${st.readonly?'disabled':''}></td>
        <td><button class="cell" data-pick="status" ${st.readonly?'disabled':''}>${statusPill(dv('status'))}</button></td>
        <td class="call"><button class="callbtn" ${r.callable?'':'disabled'} title="${esc(r.callReason||'')}" data-call="${r.row}">呼叫TA</button></td>
      </tr>`
    }).join('') || `<tr><td colspan="8" class="empty">这个榜还没有人。</td></tr>`
    $('grid').querySelectorAll('[data-edit]').forEach(inp=>{ inp.oninput = () => mark(Number(inp.closest('tr').dataset.row), inp.dataset.edit, inp.value) })
    $('grid').querySelectorAll('[data-pick]').forEach(btn=>btn.onclick=()=>openPicker(btn))
    $('grid').querySelectorAll('[data-call]').forEach(btn=>btn.onclick=()=>callMember(Number(btn.dataset.call)))
    $('grid').querySelectorAll('[data-medit]').forEach(btn=>btn.onclick=e=>{ e.stopPropagation(); openMobile(Number(btn.dataset.medit)) })
    $('grid').querySelectorAll('tbody tr[data-row]').forEach(tr=>{
      if(Number(tr.dataset.row)===selectedRow) tr.classList.add('sel')
      tr.onclick=e=>{ if(e.target.closest('input,button')) return; selectedRow=Number(tr.dataset.row); syncDeleteBtn(); $('grid').querySelectorAll('tbody tr').forEach(x=>x.classList.toggle('sel', x===tr)) }
    })
    syncDeleteBtn();
  }

  const statusPill = v => { const s=String(v||'排队中'); const t=/已完成/.test(s)?'done':/等待/.test(s)?'waiting':'queued'; return `<span class="pill ${t}">${esc(s)}</span>` }

  function mark(row,key,val){
    const s=sheet(), base=s.rows.find(r=>r.row===row); if(!base) return
    const rec=st.dirty.get(row) || {row, values:{...base}}
    rec.values[key]=val; st.dirty.set(row,rec); scheduleSave()
  }

  function scheduleSave(){ setState('','未保存（有改动）'); clearTimeout(st.timer); st.timer=setTimeout(saveNow,1200) }

  async function saveNow(){
    if(st.readonly || !st.dirty.size || st.saving) return
    const s=sheet(), rows=[], base={}
    for(const rec of st.dirty.values()){
      const cur=s.rows.find(r=>r.row===rec.row); if(!cur) continue
      if(fields().some(f=>need(f,rec))){ setState('bad','有必填没补全'); return }
      rows.push({row:rec.row, values:rec.values}); if(!cur.__new) base[rec.row]=String(cur.fp||'')
    }
    if(!rows.length){ st.dirty.clear(); setState('','已保存'); return }
    st.saving=true; setState('','保存中…')
    try{
      await api('api/save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sheet:s.name,rows,version:st.meta.version,base})})
      st.dirty.clear(); st.saving=false; setState('','已保存')
      const data=await api('api/data'); st.meta=data; st.sheets=data.sheets; st.readonly=!!(data.perm&&data.perm.readonly); renderAll()
    }catch(e){ st.saving=false; setState('bad','保存失败：'+e.message); toast('保存失败：'+e.message) }
  }

    function openPicker(btn, rowArg){
    const row=Number(rowArg ?? btn.closest('tr').dataset.row), key=btn.dataset.pick
    const s=sheet(), cur=String(value(s.rows.find(r=>r.row===row),key)||'')
    if(key==='goal' && (s.name||'').includes('攻炼')) return openAttackGoal(btn,row,cur)
    if(key==='goal' && (s.name||'').includes('剧诗')) return openTheaterGoal(btn,row,cur)
    const opts=key==='anchor'?s.options.anchor:key==='goal'?s.options.goal:s.options.status
    const multi=key==='anchor'||key==='status'
    const host=$('picker'), picked=cur.split(',').filter(Boolean)
    host.innerHTML = `<div class="hd">${key==='anchor'?'选择主播':key==='goal'?'难度及目标':'排队状态'}${multi?' · 可多选':''}</div>` +
      opts.map(o=>`<button class="opt ${picked.includes(o)?'on':''}" data-opt="${esc(o)}">${esc(o)}<span class="tick">${picked.includes(o)?'✓':''}</span></button>`).join('')
    host.classList.add('open')
    place(host,btn)
    host.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{
      const o=b.dataset.opt
      if(multi){
        const i=picked.indexOf(o); i>=0?picked.splice(i,1):picked.push(o)
        b.classList.toggle('on'); b.querySelector('.tick').textContent=i>=0?'':'✓'
        mark(row,key,picked.join(','))
      } else { picked.length=0; picked.push(o); mark(row,key,o); host.classList.remove('open') }
    })
    bindClose(host,btn)
    if(msRow===row) refreshMobile()
  }
  function openAttackGoal(btn,row,cur){
    const s=sheet(), host=$('picker')
    const parts=String(cur).split(/[｜|]/), left=parts[0]||'', target=parts[1]||''
    let modes=(left.match(/7\.\d/g)||[]).map(x=>x+'模式')
    let targets=(s.options.goal||[]).filter(x=>!x.includes('模式')); if(!targets.length) targets=['顶分','满原石','满星章']
    const modeList=['7.2模式','7.3模式']
    function modesText(){ return modes.join('、') }
    function compose(){ return (modesText()) + (target?'｜'+target:'') }
    host.innerHTML = '<div class="goal2"><div><div class="gh">模式（多选）</div>' +
      modeList.map(m=>`<button class="opt ${modes.includes(m)?'on':''}" data-mode="${m}">${m}<span class="tick">${modes.includes(m)?'✓':''}</span></button>`).join('') +
      '</div><div><div class="gh">目标（单选）</div>' +
      targets.map(t=>`<button class="opt ${target===t?'on':''}" data-target="${esc(t)}">${esc(t)}<span class="tick">${target===t?'✓':''}</span></button>`).join('') +
      '</div></div>'
    host.classList.add('open'); place(host,btn); host.style.width='340px'
    host.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{
      const m=b.dataset.mode, i=modes.indexOf(m); i>=0?modes.splice(i,1):modes.push(m)
      b.classList.toggle('on'); b.querySelector('.tick').textContent=i>=0?'':'✓'
      mark(row,'goal',compose()); if(msRow===row) refreshMobile()
    })
    host.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>{ mark(row,'goal',composeWith(b.dataset.target)); host.classList.remove('open') })
    function composeWith(t){ return (modesText()?modesText()+'｜':'') + t }
    bindClose(host,btn)
  }
  function openTheaterGoal(btn,row,cur){
    const s=sheet(), host=$('picker')
    const diffs=['困难模式','卓越模式','月谕模式']
    let targets=['满星章','满原石','顶分']
    const raw=String(cur)
    let diff=diffs.find(d=>raw.startsWith(d))||''
    let target=targets.find(t=>raw.endsWith(t))||''
    function compose(){ return (diff?diff+'｜':'')+(target||'') }
    host.innerHTML = '<div class="goal2"><div><div class="gh">难度（单选）</div>' +
      diffs.map(d=>`<button class="opt ${diff===d?'on':''}" data-diff="${d}">${d}<span class="tick">${diff===d?'✓':''}</span></button>`).join('') +
      '</div><div><div class="gh">目标（单选）</div>' +
      targets.map(t=>`<button class="opt ${target===t?'on':''}" data-target="${t}">${t}<span class="tick">${target===t?'✓':''}</span></button>`).join('') +
      '</div></div>'
    host.classList.add('open'); place(host,btn); host.style.width='340px'
    host.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{
      diff=b.dataset.diff
      host.querySelectorAll('[data-diff]').forEach(x=>{ const on=x===b; x.classList.toggle('on',on); x.querySelector('.tick').textContent=on?'✓':'' })
      mark(row,'goal',compose()); if(msRow===row) refreshMobile()
    })
    host.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>{
      target=b.dataset.target; mark(row,'goal',compose()); host.classList.remove('open')
    })
    bindClose(host,btn)
  }
  function place(host,btn){ const r=btn.getBoundingClientRect(); host.style.left=Math.min(window.innerWidth-350,Math.max(10,r.left))+'px'; host.style.top=Math.min(window.innerHeight-40,r.bottom+6)+'px' }
  function bindClose(host,btn){
    function close(){ host.classList.remove('open'); document.removeEventListener('click',outside) }
    function outside(ev){ if(!host.contains(ev.target)&&ev.target!==btn) close() }
    setTimeout(()=>document.addEventListener('click',outside),0)
  }
function syncDeleteBtn(){
  const b=$('delRow'); if(!b) return
  const s=sheet(); const r=s && s.rows.find(x=>x.row===selectedRow)
  b.disabled = st.readonly || !r
  b.textContent = r && r.__new ? '取消这一行' : '删除这一行'
}
function pickRow(s){
  const used=new Set(s.rows.map(r=>r.row))
  const start=Number(s.dataStart)||1, end=Number(s.dataEnd)||start+40
  for(let r=start;r<=end;r++) if(!used.has(r)) return r
  let r=end+1; while(used.has(r)) r++
  return r
}
function addRow(){
  if(st.readonly) return
  const s=sheet(); const row=pickRow(s); const values={}
  for(const f of fields()) values[f.key]=''
  const d=s.defaults||{}; if(d.status && (s.options?.status||[]).includes(d.status)) values.status=d.status
  s.rows.push({row, values, __new:true, seq:'新'})
  st.dirty.set(row,{row, values:{...values}, __new:true})
  selectedRow=row; renderTable(); renderDone(); setState('','新行待填写')
}
async function deleteRow(){
  if(st.readonly) return
  const s=sheet(); const r=s.rows.find(x=>x.row===selectedRow); if(!r) return
  if(r.__new){
    s.rows=s.rows.filter(x=>x!==r); st.dirty.delete(r.row); selectedRow=null; renderTable(); syncDeleteBtn(); setState('','未保存（有改动）'); return
  }
  if(!confirm('删除第 '+selectedRow+' 行？清空后自动保存，后面的行会上移。')) return
  const base={[String(selectedRow)]:String(r.fp||'')}
  const values={}; for(const f of fields()) values[f.key]=''
  st.saving=true; setState('','保存中…')
  try{
    await api('api/save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sheet:s.name,rows:[{row:selectedRow,values}],version:st.meta.version,base})})
    st.dirty.delete(selectedRow); selectedRow=null
    const data=await api('api/data'); st.meta=data; st.sheets=data.sheets; st.readonly=!!(data.perm&&data.perm.readonly)
    st.saving=false; renderAll(); setState('','已保存')
  }catch(e){ st.saving=false; setState('bad','删除失败：'+e.message); toast('删除失败：'+e.message) }
}

function fmtTime(v){ try{ return new Date(v).toLocaleString('zh-CN',{hour12:false}) }catch{ return String(v||'') } }
function fmtSize(n){ return n>1024*1024 ? (n/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(n/1024))+' KB' }
async function openPanel(kind){
  const titles={versions:'历史版本',changes:'改动记录',admins:'权限管理',ownership:'归属状态',cloud:'云端同步'}
  $('panelTitle').textContent=titles[kind]||kind

      const rows=(d.versions||[]).map(v=>'<div class="prow"><span>'+v.id+'</span><span class="t">'+fmtTime(v.at)+'</span><span class="g">'+fmtSize(v.size||0)+'</span><button data-restore="'+v.id+'">回退</button></div>').join('')
      const arcs=(d.archives||[]).map(a=>'<div class="prow"><span>'+a.id+'</span><span class="t">'+fmtTime(a.at)+'</span><span class="g">归档 · '+fmtSize(a.size||0)+'</span></div>').join('')

        try{ const r=await api('api/restore',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:b.dataset.restore,version:st.meta.version||''})}); if(r.ok){ toast('已回退到 '+b.dataset.restore); $('panelMask').classList.remove('on'); await load() } else toast(r.error||'回退失败') }
        catch(e){ toast(e.message||'回退失败') }
        finally{ b.disabled=false }
      })

      const d=await api('api/changes')
      const rows=(d.entries||[]).slice(0,200).map(e=>'<div class="prow"><span class="t">'+fmtTime(e.at)+'</span><span>'+(e.by||'系统')+'</span><span class="g">'+(e.summary||e.action||e.detail||'')+'</span></div>').join('')
      $('panelBody').innerHTML=rows||'<div class="pempty">还没有改动记录</div>'
    }else if(kind==='ownership'){
      const d=await api('api/ownership')
      const sheets=(d.sheets||[]).map(s=>'<div class="prow"><span>'+s.name+'</span><span class="g">绑定 '+s.bound+' 行</span></div>').join('')
      $('panelBody').innerHTML='<div class="prow"><span>表绑定</span><span class="g">'+((d.bindings?.count)||0)+' 行</span></div><div class="prow"><span>完成锁</span><span class="g">'+((d.locks?.count)||0)+' 条</span></div><div class="prow"><span>群名单</span><span class="g">'+((d.roster?.count)||0)+' 人</span></div>'+sheets
    }else if(kind==='admins'){
      const d=await api('api/admins')
      const one=qq=>'<div class="prow"><span>'+qq+'</span></div>'
      const owners=(d.owners||[]).map(one).join('')
      const admins=(d.admins||[]).map(one).join('')
      $('panelBody').innerHTML='<div style="margin:4px 0 6px;color:#7b8698;font-size:12px">主人</div>'+(owners||'<div class="pempty">未配置</div>')+'<div style="margin:14px 0 6px;color:#7b8698;font-size:12px">管理员</div>'+(admins||'<div class="pempty">暂无白名单管理员</div>')+'<div style="margin-top:12px;color:#8c96a6;font-size:12px">新页面暂只读展示；增删请用群里「权限」指令</div>'
    }else{
      $('panelBody').innerHTML='<div class="pempty">云端同步由服务端配置；本机模式没有可用的云端入口。</div>'
    }
  }catch(e){ $('panelBody').innerHTML='<div class="pempty">读取失败：'+(e.message||'未知错误')+'</div>' }
}
const __pn=(location.hash.match(/panel=([a-z]+)/)||[])[1];
if(__pn) setTimeout(()=>openPanel(__pn),700);

document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{ if(b.dataset.nav==='queue') return; openPanel(b.dataset.nav) })
$('panelClose').onclick=()=>$('panelMask').classList.remove('on')
$('panelMask').onclick=e=>{ if(e.target===$('panelMask')) $('panelMask').classList.remove('on') }

  load()
})()
</script>
</body>
</html>
