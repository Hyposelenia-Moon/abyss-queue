<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>排队表 · 管理</title>
<link rel="icon" href="__MOUNT__/favicon.ico" />
<style>
  :root{
    --ink:#1f2a3a;--sub:#5b6577;--muted:#8893a5;--line:rgba(30,45,80,.10);
    --blue:#1b3a8f;--green:#2f6e4e;--gold:#b98f43;--danger:#9c382b;
    --glass:linear-gradient(158deg,rgba(255,255,255,.66),rgba(255,255,255,.34));
    --shadow:0 18px 44px rgba(24,36,60,.12),inset 0 1px 0 rgba(255,255,255,.95);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:var(--ink);
    background:
      radial-gradient(900px 600px at 4% -6%,rgba(233,214,182,.5),transparent 62%),
      radial-gradient(1000px 640px at 100% -8%,rgba(190,210,246,.55),transparent 64%),
      linear-gradient(135deg,#e7eef8 0%,#e2edf0 48%,#f4eadc 100%);
    background-attachment:fixed;font-size:14px;
  }
  [hidden]{display:none !important}
  .side{position:fixed;inset:16px auto 16px 16px;width:220px;border-radius:18px;padding:16px 14px;
    background:var(--glass);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow);backdrop-filter:blur(20px);
    display:flex;flex-direction:column;gap:16px;z-index:5}
  .ss-brand{display:flex;flex-direction:column;gap:2px;padding:2px 4px}
  .ss-brand b{font-size:20px;letter-spacing:.02em}
  .ss-brand span{font-size:11px;color:var(--muted);letter-spacing:.08em}
  .ss-nav{display:flex;flex-direction:column;gap:2px}
  .ss-g{font-size:11px;color:var(--muted);padding:12px 10px 4px;letter-spacing:.08em}
  .ss-nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:9px;
    color:#3c4759;text-decoration:none;font-size:13px}
  .ss-nav a:hover{background:rgba(255,255,255,.55)}
  .ss-nav a.on{background:rgba(255,255,255,.9);color:var(--blue);font-weight:600;box-shadow:0 4px 14px rgba(24,36,60,.08)}
  .ss-me{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--sub)}
  main{margin-left:252px;padding:14px 24px 28px}
  header,.tabs{margin-left:252px;margin-right:24px}
  header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;
    background:var(--glass);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow);backdrop-filter:blur(20px)}
  #pageTitle{margin:0;font-size:13px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px}
  #pageTitle::after{content:"/";color:#b6bfcd;font-weight:400}
  .meta{font-size:12px;color:var(--muted)}
  .grow{flex:1}
  .ghost,.btn{height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.66);
    color:#33415c;font:inherit;font-size:12.5px;cursor:pointer}
  .ghost.primary,.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .savestate{font-size:12px;color:var(--green)}
  .livehint{font-size:12px;color:var(--muted)}
  .mobile-hero{display:none}
  .pagehead{display:none}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px 0}
  .tab{display:flex;min-width:0;align-items:center;gap:8px;height:54px;padding:0 14px;border-radius:14px;cursor:pointer;
    background:var(--glass);border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 26px rgba(24,36,60,.08);
    font-size:13.5px;font-weight:600;color:#3c4759}
  .tab .tabdot{width:8px;height:8px;border-radius:50%;background:var(--tab-accent,#6d5bd0);flex:none}
  .tab .n{margin-left:auto;font-family:"Times New Roman",serif;font-weight:600;font-size:14px;color:#7b8698}
  .tab.active{background:#fff;color:var(--blue);box-shadow:0 0 0 2px var(--blue),0 12px 30px rgba(24,36,60,.12)}
  .perm{padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.9);
    font-size:12.5px;color:var(--sub);margin-bottom:12px}
  .conflict{padding:12px 14px;border-radius:12px;background:rgba(255,241,240,.8);border:1px solid rgba(156,56,43,.25);
    margin-bottom:12px;font-size:12.5px}
  .conflict .h{font-weight:600;color:var(--danger);margin-bottom:4px}
  .conflict .acts{display:flex;gap:8px;margin-top:8px}
  .admins{display:none;background:var(--glass);border:1px solid rgba(255,255,255,.95);border-radius:18px;
    box-shadow:var(--shadow);backdrop-filter:blur(20px);padding:16px}
  .admins.open{display:block}
  .admins h2{font-size:15px;margin:0 0 10px}
  .admins .row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
  .admins input{height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.8);font:inherit}
  .admins button{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.8);font:inherit;font-size:12.5px;cursor:pointer}
  .admins .list,.admins .diff{font-size:12.5px;color:var(--sub)}
  .admins .tip{font-size:11.5px;color:var(--muted);margin-top:6px}
  .anchors{margin-bottom:12px}
  .anchors .h{display:flex;align-items:baseline;gap:10px;padding:0 4px 8px}
  .anchors .h b{font-size:18px}
  .anchors .body{display:block}
  .anchors .wrap{overflow:visible}
  .anchors .foot{display:flex;align-items:center;gap:10px;padding:10px 2px 0;font-size:12px;color:var(--muted)}
  .anchors .foot .tip{font-size:11.5px}
  .acards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
  .acard{padding:12px 14px;border-radius:14px;background:var(--glass);border:1px solid rgba(255,255,255,.95);
    box-shadow:0 12px 26px rgba(24,36,60,.08);display:flex;flex-direction:column;gap:7px}
  .acard-h{display:flex;align-items:center;gap:8px;min-width:0}
  .acard-h b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acard-r{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
  .ac-stars{font-style:normal;font-size:11px;color:var(--gold);letter-spacing:1px}
  .acard-rec{font-size:11px;color:var(--muted)}
  .acard-meta{font-size:11.5px;color:#7b8698;min-height:16px}
  .acard-ft{display:flex;align-items:center;gap:8px}
  .acard-cnt{font-size:11.5px;color:#5b6577;margin-right:auto}
  .acard .call-btn{height:26px;padding:0 10px;border-radius:7px;border:1px solid rgba(27,58,143,.2);background:rgba(27,58,143,.06);color:var(--blue);font-size:11.5px;cursor:pointer}
  .acard-link{font-size:11.5px;color:var(--muted);text-decoration:none}
  .acard.ispublic{opacity:.92}
  .panel{min-width:0;border-radius:18px;background:var(--glass);border:1px solid rgba(255,255,255,.95);box-shadow:var(--shadow);backdrop-filter:blur(20px);overflow:hidden}
  .panel .bar{display:flex;align-items:center;gap:10px;padding:14px 18px 8px}
  .panel-h{font-size:19.5px;font-weight:600}
  .panel .info{margin-left:auto;font-size:12px;color:var(--muted)}
  .wrap{overflow:visible}
  #grid{position:relative;min-width:0}
  #grid table{width:100%;border-collapse:collapse;table-layout:fixed}
  #grid thead th{padding:12px 10px;text-align:left;font-size:12px;font-weight:500;color:#7b8698;border-bottom:1px solid rgba(30,45,80,.08)}
  #grid tbody td{padding:0 10px;height:58px;border-bottom:1px dashed rgba(30,45,80,.07);font-size:14.5px;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #grid tbody tr:hover td{background:rgba(27,58,143,.035)}
  #grid .col-no{width:5%}
  #grid .col-nick{width:20%}
  #grid .col-gameName{width:11%}
  #grid .col-anchor{width:12%}
  #grid .col-goal{width:16%}
  #grid .col-note{width:12%}
  #grid .col-status{width:16%}
  #grid .col-call,#grid th.call{width:8%}
  #grid .chips{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
  #grid .chips .pill{display:inline-flex;align-items:center;height:30px;padding:0 13px;border-radius:999px;font-size:13px;
    color:#26365c;background:linear-gradient(160deg,rgba(255,255,255,.78),rgba(255,255,255,.42));
    border:1px solid rgba(255,255,255,.95);box-shadow:0 4px 12px rgba(24,36,60,.08);font-style:normal}
  #grid .chips .pill.status-self{color:#2f6e4e}
  #grid .chips .pill.status-anchor{color:#9f1239}
  #grid td.call .call-btn{height:30px;padding:0 12px;border-radius:9px;border:1px solid rgba(27,58,143,.18);background:rgba(27,58,143,.06);color:var(--blue);font-size:13px;cursor:pointer}
  #grid td.col-goal b{color:#a06a12;font-weight:600}
  #grid .mobile-edit-btn,#grid .call-mobile{display:none}
  .barfoot{display:flex;align-items:center;gap:10px;padding:12px 18px 16px}
  .barfoot #addRow,.barfoot #delRow{height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.7);font:inherit;font-size:12.5px;cursor:pointer}
  .barfoot #delRow.danger{color:var(--danger);border-color:rgba(156,56,43,.28)}
  .hintbar{padding:0 18px 16px;font-size:11.5px;color:var(--muted)}
  .wrap:has(> #grid){display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto 1fr;gap:14px;align-items:start;padding:0 18px 8px}
  .wrap:has(> #grid) > #grid{grid-column:1;grid-row:1 / span 2}
  .wrap:has(> #grid) > #grid > table{background:rgba(255,255,255,.18);border-radius:12px}
  .selcard{grid-column:2;grid-row:1;background:var(--glass);border:1px solid rgba(255,255,255,.95);border-radius:18px;
    box-shadow:var(--shadow);backdrop-filter:blur(20px);padding:14px 16px;font-size:12.5px}
  .donecol{grid-column:2;grid-row:2;background:var(--glass);border:1px solid rgba(255,255,255,.95);border-radius:18px;
    box-shadow:var(--shadow);backdrop-filter:blur(20px);padding:12px 16px;min-height:0;max-height:calc(100vh - 240px);overflow:auto}
  .donecol:not(.show){display:none}
  .donecol .dc-h{display:flex;align-items:baseline;gap:8px;font-size:19.5px;font-weight:600;padding:2px 0 10px}
  .donecol .dc-h .pct{margin-left:auto;font-family:"Times New Roman",serif;color:var(--green);font-size:20px}
  .donecol .bar{height:4px;border-radius:2px;background:rgba(27,58,143,.12);overflow:hidden;margin-bottom:6px}
  .donecol .bar i{display:block;height:100%;background:var(--green)}
  .donecol .dc-list{display:flex;flex-direction:column}
  .donecol .dc-i{display:flex;align-items:center;gap:8px;padding:9px 2px;border-top:1px solid rgba(30,45,80,.06);font-size:12.5px}
  .donecol .dc-ok{color:#2f9e5c;font-weight:700;flex:none}
  .donecol .dc-n{flex:1 1 auto;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .donecol .dc-g{display:none}
  .donecol .dc-by{flex:none;max-width:96px;color:#6b7689;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .donecol .dc-tm{display:none}
  .donecol .dc-undo{flex:none;height:26px;padding:0 9px;border-radius:7px;border:1px solid var(--line);background:rgba(255,255,255,.7);font-size:11.5px;color:var(--sub);cursor:pointer}
  #toast{position:fixed;right:20px;bottom:20px;z-index:80;padding:10px 14px;border-radius:10px;background:rgba(24,36,60,.9);color:#fff;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .2s}
  #toast.show{opacity:1}
  .site-footer { margin: 10px auto 0;max-width:1180px;text-align:center;font-size: 14px; font-family: inherit;color:#9aa3b2;line-height:1.8}
  #mobileBackdrop{display:none}
  #mobileSheet{display:none}
  /* 手机：退到简洁单列，保留原脚本的移动编辑入口 */
  @media (max-width:899px){
    .side{display:none}
    main{margin:0;padding:10px 12px 24px}
    header{flex-wrap:wrap;padding:10px 12px}
    .mobile-hero{display:flex;align-items:center;gap:8px;padding:12px 4px 8px}
    .mobile-hero h2{margin:0;font-size:20px}
    .mobile-hero .m{margin-left:auto;font-size:11.5px;color:var(--muted)}
    .tabs{display:flex;gap:8px;overflow:auto;padding:8px 0}
    .tab{height:44px;padding:0 12px;flex:none;font-size:12.5px}
    .acards{grid-template-columns:1fr}
    .wrap:has(> #grid){display:block;padding:0 12px 8px}
    .selcard,.donecol{display:none !important}
    #grid thead th:nth-child(3),#grid tbody td:nth-child(3),
    #grid thead th:nth-child(5),#grid tbody td:nth-child(5),
    #grid thead th.col-status,#grid tbody td.col-status,
    #grid thead th.call,#grid tbody td.call{display:none}
    #grid .mobile-edit-btn{display:inline-flex;margin-left:6px;height:24px;padding:0 8px;border-radius:6px;border:1px solid var(--line);background:rgba(255,255,255,.8);font-size:11px}
    #grid .call-mobile{display:inline-flex;margin-left:6px;height:24px;padding:0 8px;border-radius:6px;border:1px solid rgba(27,58,143,.18);background:rgba(27,58,143,.06);color:var(--blue);font-size:11px}
    body.mobile-edit-open #mobileSheet{display:flex}
    #mobileBackdrop.show{display:block;position:fixed;inset:0;background:rgba(20,28,42,.35);z-index:60}
    #mobileSheet.show{display:flex;flex-direction:column;position:fixed;left:0;right:0;bottom:0;z-index:61;background:#fff;border-radius:18px 18px 0 0;max-height:86vh}
    .ms-head{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
    .ms-head .s{margin-left:auto;font-size:11px;color:var(--muted)}
    .ms-head .x{width:32px;height:32px;border:0;background:transparent;font-size:20px}
    #mobileSheetBody{overflow:auto;padding:12px 16px}
    .ms-foot{display:flex;gap:10px;padding:12px 16px 18px}
    .ms-foot .cancel,.ms-foot .done{flex:1;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit}
    .ms-foot .done{background:var(--blue);color:#fff;border-color:var(--blue)}
  }
/* 旧脚本仍依赖的组件样式：浮层、冻结列、手机排序 */
.site-footer a{text-decoration:none;color:#6b7689}
#grid th.col-no, #grid th.col-nick {position:sticky;top:0;z-index:3;background:rgba(250,252,255,.96)}
#grid td.col-no, #grid td.col-nick {position:sticky;z-index:2;background:rgba(250,252,255,.94)}
#grid td.col-nick{left:62px}
#grid th.col-nick{left:62px}
body.can-call #grid td.col-nick {left:134px}
body.can-call #grid th.col-nick {left:134px}
.wrap{overflow:auto}
@media (min-width: 821px) {
  #grid th:nth-child(8),#grid td:nth-child(8){text-align:center}
  body.can-call #grid th:nth-child(9),body.can-call #grid td:nth-child(9){text-align:center}
}
#grid .no { text-align: center; }
#grid .rowno { text-align: center; }
.empty{padding:26px;text-align:center;color:#8893a5}
.hintbar{padding:10px 20px 14px;color:#8893a5}
.hintbar b{color:#1b3a8f}
.picker{display:none;position:fixed;top:0;left:0;z-index:40;flex-direction:column;min-width:150px;overflow:hidden;padding:8px;background:#fff;border:1px solid rgba(30,45,80,.12);border-radius:12px;box-shadow:0 16px 36px rgba(27,36,70,.18),0 0 0 1px rgba(255,255,255,.9) inset}
.picker.open{display:flex}
.picker .opts{display:flex;flex-direction:column;gap:2px;min-height:0;overflow:auto;overscroll-behavior:contain}
.picker .opts.anchor-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px}
.picker .opts.anchor-grid .opt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picker.status-picker .opts{overflow:visible}
.status-split{display:flex;gap:8px;align-items:stretch;min-width:300px}
.status-scope{flex:0 0 78px;display:flex;flex-direction:column;gap:2px;border-right:1px solid rgba(30,45,80,.1);padding-right:6px}
.status-section{color:#8893a5;padding:2px 7px 3px;white-space:nowrap}
.status-people{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;max-height:280px;overflow-y:auto}
.status-people-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px}
.opts.status-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px}
.opts.status-grid .opt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status-people-grid .opt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picker.status-picker{min-width:340px}
.picker .opt{display:flex;align-items:center;text-align:left;padding:6px 8px;white-space:nowrap;border:none;border-radius:8px;background:transparent;color:var(--ink);cursor:pointer;font:inherit;font-size:14px}
.picker .opt:hover,.picker .opt.on{background:rgba(27,58,143,.06)}
.picker .opt.on::after{content:"✓";color:#2f6e4e;font-weight:700;margin-left:6px}
.picker .opt.clear{font:inherit;color:#8893a5}
.picker .opt.none{cursor:default;color:#8893a5}
.picker .addname{flex:none;display:flex;gap:4px;align-items:center;margin-top:4px;padding-top:6px;border-top:1px dashed rgba(30,45,80,.1)}
.picker .addname input{flex:1;min-width:0;font:inherit;padding:5px 8px;border:1px solid rgba(30,45,80,.12);border-radius:8px;background:#fff;color:var(--ink)}
.picker .addname button{font:inherit;padding:5px 10px;border-radius:8px;cursor:pointer;border:1px solid #26445a;background:#eef2fb;color:#26445a}
.picker .tip{font-size:13px;color:#8893a5;padding:2px 6px}
.goal-picker{display:flex;gap:10px;align-items:stretch;flex:1 1 auto;min-height:0;overflow:visible}
.goal-col{display:flex;flex-direction:column;gap:2px;min-width:130px}
.goal-col.modes{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-right:2px}
.goal-col.targets{min-width:104px;flex:0 0 auto}
.goal-col-title{font-size:12px;color:#7b8698;padding:3px 7px 5px}
.goal-quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:0 6px 4px}
.goal-quick-btn{border:1px solid rgba(30,45,80,.14);background:rgba(255,255,255,.7);color:#4b5a8a;border-radius:6px;padding:1px 2px;font:inherit;font-size:11px;cursor:pointer}
.goal-quick-btn.on{background:#1b3a8f;border-color:#1b3a8f;color:#fff}
.goal-foot{display:flex;gap:6px;justify-content:flex-end;border-top:1px solid #e7ebf2;margin-top:6px;padding-top:6px}
.goal-foot button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:5px;padding:3px 10px;font:inherit;cursor:pointer}
.goal-foot button.done{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
.td.rowno{text-align:center}
@media (max-width: 820px) {
  #grid td.col-nick{position:static;left:auto}
  #grid th.col-nick{position:static;left:auto}
  td.rowno{order:0;padding:8px 10px}
  td.actions{order:1;margin-left:auto;padding:8px 10px}
  .picker .opt{padding:8px}
  .wrap{overflow:visible}
}

#grid td.col-nick { width: var(--nick-w, 170px); }
#grid td.col-status { width: var(--status-w, 280px); }
#grid td.col-nick.alt { width: var(--nick-w, 150px); }
#grid .chips { flex-wrap: nowrap; }
#grid td.picking { z-index: 60; position: relative; }
</style>
</head>
<body>
<aside class="side" id="shellSide" aria-label="榜单导航">
  <div class="ss-brand"><b>排队表</b><span>PC · 管理台</span></div>
  <nav class="ss-nav">
    <div class="ss-g">数据</div><a href="#" data-nav="queue" class="on">排队表</a>
    <div class="ss-g">版本与审计</div><a href="#" data-nav="versions">历史版本</a><a href="#" data-nav="changes">改动记录</a>
    <div class="ss-g">权限与归属</div><a href="#" data-nav="admins">权限管理</a><a href="#" data-nav="ownership">归属状态</a>
    <div class="ss-g">系统</div><a href="#" data-nav="cloud">云端同步</a>
  </nav>
  <div class="ss-me"><b id="ssWho">管理台</b><br>本机 · 可编辑</div>
</aside>
<header>
  <h1 id="pageTitle">排队表</h1><div class="meta" id="meta">加载中…</div><div class="grow"></div>
  <button class="ghost" id="versionsBtn" hidden>历史版本</button>
  <button class="ghost" id="changesBtn" hidden>改动记录</button>
  <button class="ghost" id="cloudBtn" hidden>上传覆盖云端</button>
  <button class="ghost" id="ownershipBtn" hidden>归属状态</button>
  <button class="ghost" id="adminBtn" hidden>权限管理</button>
  <button class="ghost" id="reload">重新读取</button>
  <button class="ghost" id="rollbackPrev" hidden>回退</button>
  <button class="ghost" id="rollbackNext" hidden>前进</button>
  <span class="savestate" id="saveState"></span><span class="livehint" id="liveHint"></span>
</header>
<div class="mobile-hero" id="mobileHero"><h2 id="mobileHeroTitle">排队表</h2><div class="m" id="mobileHeroMeta"></div>
  <button class="ghost" id="mobileAdminBtn" type="button">管理</button></div>
<div class="pagehead" hidden><h2 class="sheet-h" id="sheetHeading"></h2></div>
<div class="tabs" id="tabs"></div>
<main>
  <div class="perm" id="perm" hidden></div>
  <div class="conflict" id="conflict" hidden>
    <div class="h" id="conflictTitle"></div><div id="conflictTip"></div>
    <div class="acts"><button class="ghost primary" id="conflictReload">读取最新并对比</button><button class="ghost" id="conflictKeep">先不管，继续改</button></div>
    <div class="diff" id="conflictDiff"></div>
  </div>
  <div class="admins" id="admins"><h2>可以改所有人信息的人</h2>
    <div class="row"><input id="adminInput" placeholder="QQ 号，例：1000000001（只认 QQ）" autocomplete="off" /><button id="adminAdd">添加</button></div>
    <div class="list" id="adminList"></div><div class="tip" id="adminTip"></div></div>
  <div class="admins" id="changes"><h2>改动记录（只留最近 <span id="changesKeep">2000</span> 条）</h2>
    <div class="row"><button id="changesLoad">刷新</button></div><div class="list" id="changeList"></div><div class="tip" id="changeTip"></div></div>
  <div class="admins" id="versions"><h2>历史版本（只留最近 <span id="versionsKeep">20</span> 份）</h2>
    <div class="list" id="versionList"></div><div class="tip" id="versionTip"></div>
    <h2>归档（每日只留最近 <span id="archiveDays">7</span> 天）</h2><div class="list" id="archiveList"></div><div class="tip" id="archiveTip"></div></div>
  <div class="admins" id="ownership"><h2>归属状态（QQ → 行）</h2>
    <div class="row"><button id="ownershipLoad">查看归属状态</button><button id="ownershipRebuild">按当前表重建归属</button></div>
    <div class="list" id="ownershipList"></div><div class="tip" id="ownershipTip"></div>
    <h2>退群候选行</h2><div class="row"><button id="ownershipPrune">删除这些行</button></div>
    <div class="list" id="missingList"></div><div class="tip" id="missingTip"></div></div>
  <div class="anchors" id="anchors">
    <div class="h"><b>主播列表</b></div>
    <div class="body"><div class="wrap"><div id="anchorGrid"></div></div>
      <div class="foot"><button class="ghost primary" id="anchorSave">保存主播列表</button><span id="anchorAddHost"></span><span class="tip" id="anchorTip"></span></div>
    </div>
  </div>
  <div class="panel">
    <div class="bar"><span class="info" id="hint"></span></div>
    <div class="wrap"><div id="grid"></div><div id="selCard" class="selcard" hidden></div><div id="doneCol" class="donecol"></div></div>
    <div id="mobileBackdrop" aria-hidden="true"></div>
    <div id="mobileSheet" role="dialog" aria-modal="true" aria-label="编辑排队行">
      <div class="ms-head"><span class="t" id="mobileSheetTitle">编辑</span><span class="s">自动保存</span><button class="x" type="button" id="mobileSheetClose" aria-label="收起编辑">×</button></div>
      <div id="mobileSheetBody"></div>
      <div class="ms-foot"><button class="cancel" type="button" id="mobileSheetCancel">取消</button><button class="done" type="button" id="mobileSheetDone">保存并收起</button></div>
    </div>
    <div class="bar barfoot"><button id="addRow">＋ 新增一行</button><button id="delRow" class="danger" type="button" disabled title="先点要删除的那一行">删除这一行</button><span class="grow"></span></div>
  </div>
  <div class="hintbar" id="hintbar" hidden><b>带 * 的必填</b>：群昵称、原神游戏名、选择主播、难度及目标。整行留空即删除该行。</div>
  <div class="site-footer" id="siteFooter" hidden></div>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<!--SCRIPTS-->
</body>
</html>
