<!DOCTYPE html>
<html lang="zh-cn">
  <head>
    <meta charset="utf-8" />
    <title>{{name}} 主播</title>
    <style>
      @font-face { font-family: "GenshinTitle"; src: url("{{fontTitle}}") format("truetype"); font-weight: normal; font-style: normal; }
      @font-face { font-family: "GenshinBody"; src: url("{{fontBody}}") format("truetype"); font-weight: normal; font-style: normal; }
      @font-face { font-family: "GenshinNumber"; src: url("{{fontNumber}}") format("truetype"); font-weight: normal; font-style: normal; }

      :root {
        --ink: #2b2f38;
        --gold: #c8a35a;
        --bar-a: #2b3566;
        --bar-b: #3d4a8a;
        --head: #3d4a8a;
        --row: #eef2fb;
        --row-alt: #f7f9fd;
        --line: #93a2c4;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 820px;
        padding: 20px;
        background: #f4f6fa;
        font-family: "GenshinBody", "Microsoft YaHei", sans-serif;
        font-size: 14px;
        /* 全局加粗：汉仪文黑只有单一字重，浏览器做合成加粗 */
        font-weight: bold;
        color: var(--ink);
      }
      .card { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 3px 14px rgba(43, 53, 102, 0.14); }
      .title {
        background: linear-gradient(135deg, var(--bar-a), var(--bar-b));
        color: #fff; padding: 14px 20px;
        font-family: "GenshinTitle", "Microsoft YaHei", sans-serif;
        font-size: 21px; letter-spacing: 1px;
        display: flex; align-items: baseline; justify-content: space-between;
        border-bottom: 3px solid var(--gold);
      }
      .title .count { font-size: 15px; color: #f0d9a8; }

      table { width: 100%; border-collapse: collapse; table-layout: fixed; margin: 12px 0 0; }
      thead th {
        background: var(--head); color: #fff;
        font-family: "GenshinTitle", "Microsoft YaHei", sans-serif;
        font-size: 14px; font-weight: bold; padding: 9px 8px; text-align: center;
        border: 1px solid var(--line); border-bottom: 2px solid var(--gold);
      }
      tbody td {
        padding: 9px 8px; border: 1px solid var(--line);
        font-size: 14px; line-height: 1.55; word-break: break-all; vertical-align: middle;
      }
      tbody tr:nth-child(odd) td { background: var(--row); }
      tbody tr:nth-child(even) td { background: var(--row-alt); }
      td.name { font-family: "GenshinTitle", "Microsoft YaHei", sans-serif; }
      td.rec { text-align: center; }
      .badge {
        display: inline-block; padding: 1px 8px; border-radius: 9px;
        background: #e7ecf9; color: #3d4a8a; font-size: 12px;
      }
      .badge.strong { background: var(--gold); color: #4a3a10; font-weight: bold; }
      .entry { color: #4b5680; font-size: 13px; }
      .empty { padding: 30px 0; text-align: center; color: #7b849b; }
      .foot { padding: 10px 20px 14px; font-size: 12px; color: #7b849b; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="title">
        <span>{{name}} · 帮帮主播</span>
        <span class="count">{{total}} 位</span>
      </div>

      {{if anchors.length}}
      <div style="padding: 0 20px 14px">
        <table>
          <colgroup>
            <col style="width: 170px" />
            <col style="width: 110px" />
            <col style="width: 250px" />
            <col style="width: 200px" />
          </colgroup>
          <thead>
            <tr>
              <th>主播</th>
              <th>推荐度</th>
              <th>核心强项</th>
              <th>直播入口</th>
            </tr>
          </thead>
          <tbody>
            {{each anchors a}}
            <tr>
              <td class="name">{{a.name}}</td>
              <td class="rec">{{if a.recommend}}<span class="badge {{if a.recommend.indexOf('推荐') >= 0 && a.recommend.indexOf('可选') < 0}}strong{{/if}}">{{a.recommend}}</span>{{else}}—{{/if}}</td>
              <td>{{a.skills || "—"}}</td>
              <td class="entry">{{a.entry || "—"}}</td>
            </tr>
            {{/each}}
          </tbody>
        </table>
      </div>
      {{else}}
      <div class="empty">表里没有识别到主播信息</div>
      {{/if}}

      <div class="foot">报名时直接填主播名或序号，唯一命中即自动归一 · 数据来自本地排表</div>
    </div>
  </body>
</html>
