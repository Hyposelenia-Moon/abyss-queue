<!DOCTYPE html>
<html lang="zh-cn">
  <head>
    <meta charset="utf-8" />
    <title>{{name}} 主播</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 700px;
        padding: 18px;
        background: #f2f4f8;
        font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
        font-size: 14px;
        color: #2b2f38;
      }
      .card { background: #fff; border-radius: 12px; padding: 16px 18px 14px; box-shadow: 0 2px 10px rgba(31, 45, 61, 0.08); }
      .head { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 2px solid #e8ebf0; padding-bottom: 10px; margin-bottom: 12px; }
      .head .name { font-size: 20px; font-weight: 700; }
      .head .cnt { font-size: 14px; color: #d4622a; font-weight: 700; }
      .item { padding: 10px 2px; border-bottom: 1px solid #f0f3f7; }
      .item:last-child { border-bottom: none; }
      .row { display: flex; align-items: baseline; gap: 8px; }
      .aname { font-size: 15px; font-weight: 700; word-break: break-all; }
      .badge { flex: none; padding: 0 7px; height: 18px; line-height: 18px; font-size: 11px; color: #fff; background: #d4622a; border-radius: 9px; }
      .line { margin-top: 4px; font-size: 13px; color: #5b6472; word-break: break-all; line-height: 1.5; }
      .label { color: #8b93a1; }
      .empty { padding: 26px 0; text-align: center; color: #8b93a1; }
      .foot { margin-top: 10px; font-size: 12px; color: #8b93a1; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="head">
        <span class="name">【{{name}}】帮帮主播</span>
        <span class="cnt">{{total}} 位</span>
      </div>

      {{if anchors.length}}
      {{each anchors a}}
      <div class="item">
        <div class="row">
          <span class="aname">{{a.name}}</span>
          {{if a.recommend}}<span class="badge">{{a.recommend}}</span>{{/if}}
        </div>
        {{if a.skills}}<div class="line"><span class="label">强项：</span>{{a.skills}}</div>{{/if}}
        {{if a.entry}}<div class="line"><span class="label">入口：</span>{{a.entry}}</div>{{/if}}
      </div>
      {{/each}}
      {{else}}
      <div class="empty">表里没有识别到主播信息</div>
      {{/if}}

      <div class="foot">报名时可直接填主播名或序号，唯一命中即自动归一</div>
    </div>
  </body>
</html>
