<!DOCTYPE html>
<html lang="zh-cn">
  <head>
    <meta charset="utf-8" />
    <title>三路深渊排队</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 700px;
        padding: 18px;
        background: #f2f4f8;
        font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
        font-size: 14px;
        color: #2b2f38;
      }
      .card { background: #fff; border-radius: 12px; padding: 16px 18px 14px; box-shadow: 0 2px 10px rgba(31, 45, 61, 0.08); }
      .title { font-size: 20px; font-weight: 700; border-bottom: 2px solid #e8ebf0; padding-bottom: 10px; margin-bottom: 12px; }
      .sheet { display: flex; align-items: baseline; justify-content: space-between; padding: 9px 2px; border-bottom: 1px solid #f0f3f7; }
      .sheet .sname { font-weight: 600; word-break: break-all; }
      .sheet .scount { flex: none; color: #d4622a; font-weight: 700; }
      .cmds { margin-top: 12px; }
      .cmds .h { font-size: 12px; color: #8b93a1; margin-bottom: 6px; }
      .cmd { padding: 5px 0; font-size: 13px; color: #5b6472; line-height: 1.5; word-break: break-all; }
      .cmd code { padding: 1px 6px; background: #f2f4f8; border-radius: 4px; color: #2b2f38; font-family: Consolas, "Courier New", monospace; }
      .foot { margin-top: 12px; font-size: 12px; color: #8b93a1; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="title">三路深渊排队</div>

      {{each sheets s}}
      <div class="sheet">
        <span class="sname">{{s.name}}</span>
        <span class="scount">{{s.count}} 人在排</span>
      </div>
      {{/each}}

      <div class="cmds">
        <div class="h">常用指令</div>
        <div class="cmd"><code>#{{defaultSheet}}</code> 查看该榜队列（加「全部」显示全部）</div>
        <div class="cmd"><code>#深渊报名</code> 引导式报名，按提示一步步填</div>
        <div class="cmd"><code>#深渊报名 &lt;榜&gt; &lt;游戏名&gt; &lt;主播&gt; &lt;难度&gt; &lt;强度&gt; [备注]</code> 一行式报名</div>
        <div class="cmd"><code>#深渊我的</code> 查看自己的报名记录</div>
        <div class="cmd"><code>#深渊退队</code> 退出排队</div>
        <div class="cmd"><code>#深渊改备注 &lt;内容&gt;</code> 修改自己的备注</div>
        <div class="cmd"><code>#深渊主播 &lt;榜&gt;</code> 查看帮帮主播列表</div>
        <div class="cmd"><code>#更新 abyss</code> 更新插件（仅主人）</div>
      </div>

      <div class="foot">{{version}}</div>
    </div>
  </body>
</html>
