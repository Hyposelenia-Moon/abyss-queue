<!DOCTYPE html>
<html lang="zh-cn">
  <head>
    <meta charset="utf-8" />
    <title>{{title}}</title>
    <style>
      @font-face { font-family: "GenshinTitle"; src: url("{{fontTitle}}") format("truetype"); font-weight: normal; font-style: normal; }
      @font-face { font-family: "GenshinBody"; src: url("{{fontBody}}") format("truetype"); font-weight: normal; font-style: normal; }
      @font-face { font-family: "GenshinNumber"; src: url("{{fontNumber}}") format("truetype"); font-weight: normal; font-style: normal; }
      @font-face { font-family: "GenshinDisplay"; src: url("{{fontDisplay}}") format("woff"); font-weight: normal; font-style: normal; }

      /* ── 统一设计 token：与编辑器 editor/editor.html 末尾「统一材质」段同一套取值，改一处要两边一起改 ── */
      :root {
        --aq-canvas: #eef1f5;
        --aq-paper: #ffffff;
        --aq-sunk: #f6f8fb;
        --aq-sunk-2: #eef2f8;
        --aq-rule: #e3e8f0;
        --aq-rule-2: #d3dae6;
        --aq-ink: #18202e;
        --aq-ink-2: #3a4456;
        --aq-ink-3: #5f6a7d;
        --aq-ink-4: #717b8d;
        --aq-abyss: #1b3a8f;
        --aq-abyss-deep: #13295f;
        --aq-abyss-tint: #eaf0fb;
        --aq-gold: #8a6420;
        --aq-gold-line: #b48c45;
        --aq-gold-soft: #e2cc9c;
        --aq-gold-tint: #f7efe0;
        --aq-r-lg: 14px;
        --aq-r-md: 10px;
        --aq-r-sm: 7px;
        --aq-r-xs: 5px;
        --aq-sh-1: 0 1px 2px rgba(16, 24, 40, 0.05);
        --aq-sh-2: 0 1px 2px rgba(16, 24, 40, 0.06), 0 12px 32px -14px rgba(16, 24, 40, 0.24);
        /* 档位色（字 / 底 / 描边）：与编辑器 --t-* 同名同值 */
        --t-blue-fg: #1d4791;   --t-blue-bg: #e9effb;   --t-blue-bd: #c9d6f1;
        --t-amber-fg: #6e4c0c;  --t-amber-bg: #f8efdb;  --t-amber-bd: #e6d0a0;
        --t-green-fg: #1d5a3f;  --t-green-bg: #e5f2ea;  --t-green-bd: #b9dcc7;
        --t-red-fg: #9a2a20;    --t-red-bg: #fbeae7;    --t-red-bd: #efc4be;
        --t-purple-fg: #41246a; --t-purple-bg: #f0eaf8; --t-purple-bd: #d6c8ea;
        --t-orange-fg: #7a4a06; --t-orange-bg: #fcf0de; --t-orange-bd: #f0d3a4;
        --t-ink-fg: #1b2230;    --t-ink-bg: #e6e9ee;    --t-ink-bd: #c6ccd6;
        --t-neutral-fg: #4a5466; --t-neutral-bg: #f1f3f6; --t-neutral-bd: #dce1e8;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      /* 渲染器视口可能比 body 宽；html 也铺底色，避免右侧出现透明/黑条 */
      html { background: var(--aq-canvas); }

      /* 与编辑器同一张画布：浅底 + 右上角同心涟漪，是整套视觉唯一的装饰纹样 */
      body {
        width: 820px;
        padding: 16px;
        background-color: var(--aq-canvas);
        background-image:
          radial-gradient(circle at 100% 0, rgba(238, 241, 245, 0) 0, var(--aq-canvas) 620px),
          repeating-radial-gradient(circle at 100% 0, rgba(27, 58, 143, 0.06) 0, rgba(27, 58, 143, 0.06) 1px, rgba(27, 58, 143, 0) 1.5px, rgba(27, 58, 143, 0) 22px);
        font-family: "Times New Roman", "GenshinBody", "Microsoft YaHei", sans-serif;
        font-size: 15px;
        font-weight: normal;
        color: var(--aq-ink);
      }
      /* 页面骨架 = 编辑器那一套：页头平铺在画布上，下面一串同尺寸卡片，靠 14px 间隙分开 */
      .card { display: flex; flex-direction: column; gap: 14px; }

      /* ── 页头：不再是深色横幅，跟编辑器一样浅底大字 + 右上角统计，底下一道发丝线收口 ── */
      .title {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        padding: 2px 4px 14px;
        border-bottom: 1px solid var(--aq-rule);
        color: var(--aq-ink);
        font-family: "GenshinNumber", "GenshinDisplay", "GenshinTitle", "Microsoft YaHei", sans-serif;
        font-size: 36px;
        font-weight: bold;
        line-height: 1.25;
        letter-spacing: 1.5px;
      }
      .title .count, .title .sub {
        font-family: "Times New Roman", "GenshinBody", "Microsoft YaHei", sans-serif;
        font-size: 14.5px;
        font-weight: 600;
        color: var(--aq-gold);
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
      /* 分区小标题：小字 + 前置一截暗金短线（与编辑器 hero 上的小标签同一笔触） */
      .sec { display: flex; align-items: center; gap: 9px; padding: 0 4px; font-size: 13.5px; font-weight: 600; color: var(--aq-gold); letter-spacing: 0.12em; }
      .sec::before { content: ""; flex: none; width: 3px; height: 14px; border-radius: 2px; background: var(--aq-gold-line); }
      .foot { padding: 0 4px; font-size: 13.5px; color: var(--aq-ink-3); }
      .ver { padding: 0 4px; font-size: 12.5px; color: var(--aq-ink-3); }

      /* ── 帮助分组：一组一张白卡，组头浅底 + 暗金细线；行间只有发丝线，不再用斑马纹 ── */
      .groups { display: flex; flex-direction: column; gap: 14px; padding: 0; }
      .group { border: 1px solid var(--aq-rule); border-radius: var(--aq-r-lg); overflow: hidden; background: var(--aq-paper); box-shadow: var(--aq-sh-1); margin-top: 0; }
      .group .h {
        display: flex; align-items: center; gap: 9px;
        background: var(--aq-gold-tint); color: var(--aq-gold); padding: 11px 16px;
        font-family: "Times New Roman", "GenshinTitle", "Microsoft YaHei", sans-serif; font-size: 16px; font-weight: bold; letter-spacing: 0.06em;
        border-bottom: 1px solid var(--aq-gold-line);
      }
      .group .h::before { content: ""; flex: none; width: 3px; height: 14px; border-radius: 2px; background: var(--aq-gold-line); }
      .row { display: flex; gap: 16px; padding: 11px 16px; align-items: center; min-height: 46px; border-top: 1px solid var(--aq-rule); }
      .group .h + .row { border-top: 0; }
      /* 指令：做成一列醒目的蓝色粗字，允许换行、不再用省略号截断——指令本身就是这张图要读的内容 */
      .row .cmd {
        flex: 0 0 212px; font-family: "Times New Roman", "GenshinNumber", "GenshinBody", sans-serif;
        color: var(--aq-gold); font-weight: bold; font-size: 15px; line-height: 1.6;
        white-space: normal; overflow-wrap: anywhere;
      }
      .row .desc { flex: 1; min-width: 0; color: var(--aq-ink-2); font-size: 14px; line-height: 1.6; }
      .note { padding: 0 4px; font-size: 13.5px; color: var(--aq-ink-3); line-height: 1.7; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="title">
        <span>{{title}}</span>
        {{if subTitle}}<span class="sub">{{subTitle}}</span>{{/if}}
      </div>

      <div class="groups">
        {{each helpGroups g}}
        <div class="group">
          <div class="h">{{g.group}}</div>
          {{each g.list item}}
          <div class="row">
            <span class="cmd">{{item.title}}</span>
            <span class="desc">{{item.desc}}</span>
          </div>
          {{/each}}
        </div>
        {{/each}}
      </div>

      {{if note}}<div class="note">{{note}}</div>{{/if}}
      <div class="ver">{{version}}</div>
    </div>
  </body>
</html>
