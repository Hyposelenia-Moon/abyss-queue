<!DOCTYPE html>
<html lang="zh-cn">
  <head>
    <meta charset="utf-8" />
    <title>{{title}}</title>
    <style>
      @font-face { font-family: "GenshinTitle"; src: url("{{fontTitle}}") format("truetype"); font-weight: normal; font-style: normal; }
      @font-face { font-family: "GenshinBody"; src: url("{{fontBody}}") format("truetype"); font-weight: normal; font-style: normal; }
      @font-face { font-family: "GenshinNumber"; src: url("{{fontNumber}}") format("truetype"); font-weight: normal; font-style: normal; }

      :root {
        --ink: #2b2f38;
        --gold: #c8a35a;
        --bar-a: #2b3566;
        --bar-b: #3d4a8a;
        --head: #3d4a8a;
        --row: #eef2fb;
        --row-alt: #f7f9fd;
        --line: #93a2c4;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 820px; padding: 20px; background: #f4f6fa;
        font-family: "GenshinBody", "Microsoft YaHei", sans-serif;
        font-size: 14px; font-weight: bold; color: var(--ink);
      }
      .card { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 3px 14px rgba(43, 53, 102, 0.14); }
      .title {
        background: linear-gradient(135deg, var(--bar-a), var(--bar-b));
        color: #fff; padding: 14px 20px;
        font-family: "GenshinTitle", "Microsoft YaHei", sans-serif;
        font-size: 21px; letter-spacing: 1px;
        display: flex; align-items: baseline; justify-content: space-between;
        border-bottom: 3px solid var(--gold);
      }
      .title .sub { font-size: 13px; color: #f0d9a8; font-family: "GenshinBody", "Microsoft YaHei", sans-serif; }

      .groups { padding: 4px 20px 10px; }
      .group { margin-top: 14px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
      .group .h {
        background: var(--head); color: #fff; padding: 7px 14px;
        font-family: "GenshinTitle", "Microsoft YaHei", sans-serif; font-size: 15px;
        border-bottom: 2px solid var(--gold);
      }
      .row { display: flex; gap: 12px; padding: 8px 14px; align-items: baseline; }
      .row:nth-child(odd) { background: var(--row); }
      .row:nth-child(even) { background: var(--row-alt); }
      .row .cmd {
        flex: 0 0 230px; font-family: "GenshinNumber", "GenshinBody", sans-serif;
        color: #2b3566; background: #e7ecf9; border-radius: 4px; padding: 1px 8px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .row .desc { flex: 1; min-width: 0; color: #3d4a8a; font-size: 13px; line-height: 1.5; }

      .note { margin: 12px 20px 0; font-size: 12px; color: #7b849b; line-height: 1.6; }
      .ver { padding: 10px 20px 14px; font-size: 12px; color: #9aa3b8; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="title">
        <span>{{title}}</span>
        {{if subTitle}}<span class="sub">{{subTitle}}</span>{{/if}}
      </div>

      <div class="groups">
        {{each helpGroups g}}
        <div class="group">
          <div class="h">{{g.group}}</div>
          {{each g.list item}}
          <div class="row">
            <span class="cmd">{{item.title}}</span>
            <span class="desc">{{item.desc}}</span>
          </div>
          {{/each}}
        </div>
        {{/each}}
      </div>

      {{if note}}<div class="note">{{note}}</div>{{/if}}
      <div class="ver">{{version}}</div>
    </div>
  </body>
</html>
