<!DOCTYPE html>
<html lang="zh-cn">
  <head>
    <meta charset="utf-8" />
    <title>{{title}}</title>
    <style>
      @font-face { font-family: "GenshinTitle"; src: url("{{fontTitle}}") format("truetype"); font-weight: normal; font-style: normal; }
      @font-face { font-family: "GenshinBody"; src: url("{{fontBody}}") format("truetype"); font-weight: normal; font-style: normal; }
      @font-face { font-family: "GenshinNumber"; src: url("{{fontNumber}}") format("truetype"); font-weight: normal; font-style: normal; }

      /* ── 统一设计 token：与编辑器 editor/editor.html 末尾「统一材质」段同一套取值，改一处要两边一起改 ── */
      :root {
        --aq-canvas: #eef1f5;
        --aq-paper: #ffffff;
        --aq-sunk: #f6f8fb;
        --aq-sunk-2: #eef2f8;
        --aq-rule: #e3e8f0;
        --aq-rule-2: #d3dae6;
        --aq-ink: #18202e;
        --aq-ink-2: #3a4456;
        --aq-ink-3: #5f6a7d;
        --aq-ink-4: #717b8d;
        --aq-abyss: #1b3a8f;
        --aq-abyss-deep: #13295f;
        --aq-abyss-tint: #eaf0fb;
        --aq-gold: #8a6420;
        --aq-gold-line: #b48c45;
        --aq-gold-soft: #e2cc9c;
        --aq-gold-tint: #f7efe0;
        --aq-r-lg: 14px;
        --aq-r-md: 10px;
        --aq-r-sm: 7px;
        --aq-r-xs: 5px;
        --aq-sh-2: 0 1px 2px rgba(16, 24, 40, 0.06), 0 12px 32px -14px rgba(16, 24, 40, 0.24);
        /* 档位色（字 / 底 / 描边）：语义与映射沿用原样，这里只定取值 */
        --tone-blue-fg: #1d4791;   --tone-blue-bg: #e9effb;   --tone-blue-bd: #c9d6f1;
        --tone-amber-fg: #6e4c0c;  --tone-amber-bg: #f8efdb;  --tone-amber-bd: #e6d0a0;
        --tone-green-fg: #1d5a3f;  --tone-green-bg: #e5f2ea;  --tone-green-bd: #b9dcc7;
        --tone-red-fg: #9a2a20;    --tone-red-bg: #fbeae7;    --tone-red-bd: #efc4be;
        --tone-purple-fg: #41246a; --tone-purple-bg: #f0eaf8; --tone-purple-bd: #d6c8ea;
        --tone-orange-fg: #7a4a06; --tone-orange-bg: #fcf0de; --tone-orange-bd: #f0d3a4;
        --tone-neutral-fg: #4a5466; --tone-neutral-bg: #f1f3f6; --tone-neutral-bd: #dce1e8;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      /* 渲染器视口可能比 body 宽；html 也铺底色，避免右侧出现透明/黑条 */
      html { background: var(--aq-canvas); }
      body {
        width: 820px; padding: 20px; background: var(--aq-canvas);
        font-family: "Times New Roman", "GenshinBody", "Microsoft YaHei", sans-serif;
        font-size: 14px; font-weight: normal; color: var(--aq-ink);
      }
      /* 纸面卡：不透明白底 + 一层柔和投影，不用玻璃、不叠内高光 */
      .card { background: var(--aq-paper); border-radius: var(--aq-r-lg); overflow: hidden; box-shadow: var(--aq-sh-2); }

      /* 标题带：深墨蓝实底；右上角一组同心细环（「深渊涟漪」）由近及远淡出，是整套视觉唯一的装饰纹样；
         左下一截暗金短线做书签，取代原来整条亮金粗边 */
      .title {
        position: relative;
        color: #fff;
        background-color: var(--aq-abyss-deep);
        background-image:
          radial-gradient(circle at 100% 0, rgba(19, 41, 95, 0) 0, var(--aq-abyss-deep) 420px),
          repeating-radial-gradient(circle at 100% 0, rgba(255, 255, 255, 0.075) 0, rgba(255, 255, 255, 0.075) 1px, rgba(255, 255, 255, 0) 1.5px, rgba(255, 255, 255, 0) 16px);
        font-family: "Times New Roman", "GenshinTitle", "Microsoft YaHei", sans-serif;
        font-weight: bold;
        letter-spacing: 1px;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
      }
      .title::after { content: ""; position: absolute; left: 24px; bottom: 0; width: 44px; height: 3px; background: var(--aq-gold-line); }
      .title { padding: 16px 22px 14px; font-size: 22px; }
      .title .sub { font-size: 13px; color: var(--aq-gold-soft); font-weight: normal; letter-spacing: 0.5px; font-family: "Times New Roman", "GenshinBody", "Microsoft YaHei", sans-serif; }
      .title::after { left: 22px; width: 36px; }

      .groups { padding: 6px 22px 4px; }
      .group { margin-top: 14px; border: 1px solid var(--aq-rule); border-radius: var(--aq-r-md); overflow: hidden; background: var(--aq-paper); }
      /* 分组头：浅底 + 前置暗金短线，不再用深色实条 */
      .group .h {
        display: flex; align-items: center; gap: 9px;
        background: var(--aq-sunk-2); color: var(--aq-abyss-deep); padding: 8px 14px;
        font-family: "Times New Roman", "GenshinTitle", "Microsoft YaHei", sans-serif; font-size: 15px; font-weight: bold; letter-spacing: 0.04em;
        border-bottom: 1px solid var(--aq-rule);
      }
      .group .h::before { content: ""; flex: none; width: 12px; height: 2px; background: var(--aq-gold-line); }
      .row { display: flex; gap: 14px; padding: 9px 14px; align-items: baseline; border-top: 1px solid var(--aq-rule); }
      .group .h + .row { border-top: 0; }
      .row:nth-child(odd) { background: var(--aq-sunk); }
      .row:nth-child(even) { background: var(--aq-paper); }
      /* 指令：做成一列醒目的蓝色粗字，允许换行、不再用省略号截断——指令本身就是这张图要读的内容 */
      .row .cmd {
        flex: 0 0 200px; font-family: "Times New Roman", "GenshinNumber", "GenshinBody", sans-serif;
        color: var(--aq-abyss); font-weight: bold; font-size: 14.5px; line-height: 1.6;
        white-space: normal; overflow-wrap: anywhere;
      }
      .row .desc { flex: 1; min-width: 0; color: var(--aq-ink-2); font-size: 13.5px; line-height: 1.6; }

      .note { margin: 14px 22px 0; padding-top: 10px; border-top: 1px solid var(--aq-rule); font-size: 12.5px; color: var(--aq-ink-3); line-height: 1.7; }
      .ver { padding: 8px 22px 16px; font-size: 12px; color: var(--aq-ink-4); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="title">
        <span>{{title}}</span>
        {{if subTitle}}<span class="sub">{{subTitle}}</span>{{/if}}
      </div>

      <div class="groups">
        {{each helpGroups g}}
        <div class="group">
          <div class="h">{{g.group}}</div>
          {{each g.list item}}
          <div class="row">
            <span class="cmd">{{item.title}}</span>
            <span class="desc">{{item.desc}}</span>
          </div>
          {{/each}}
        </div>
        {{/each}}
      </div>

      {{if note}}<div class="note">{{note}}</div>{{/if}}
      <div class="ver">{{version}}</div>
    </div>
  </body>
</html>
