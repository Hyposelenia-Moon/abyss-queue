<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>排队表 · 本地编辑器</title>
    <style>
      :root {
        --ink: #23283a;
        --muted: #6b7590;
        --bar-a: #2b3566;
        --bar-b: #3d4a8a;
        --gold: #c8a35a;
        --line: #d6deef;
        --row: #f4f7fd;
        --row-alt: #fbfcff;
        --danger: #c0392b;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font: 14px/1.5 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; color: var(--ink); background: #eef1f8; }

      header {
        background: linear-gradient(135deg, var(--bar-a), var(--bar-b));
        color: #fff; padding: 14px 20px; border-bottom: 3px solid var(--gold);
        display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      }
      header h1 { font-size: 18px; font-weight: 700; letter-spacing: .5px; }
      header .meta { font-size: 12px; color: #cfd8f2; }
      header .grow { flex: 1; }
      header a.online {
        color: #ffe9b8; text-decoration: none; border: 1px solid rgba(255, 233, 184, .5);
        padding: 5px 12px; border-radius: 6px; font-size: 13px;
      }
      header a.online:hover { background: rgba(255, 255, 255, .12); }
      button {
        font: inherit; padding: 6px 14px; border-radius: 6px; cursor: pointer;
        border: 1px solid var(--line); background: #fff; color: var(--ink);
      }
      button:hover { border-color: var(--bar-b); }
      button.primary { background: var(--gold); border-color: var(--gold); color: #3a2c07; font-weight: 700; }
      button.primary:hover { filter: brightness(1.06); }
      button.ghost { background: rgba(255, 255, 255, .12); color: #fff; border-color: rgba(255, 255, 255, .35); }
      button.danger { color: var(--danger); border-color: #f0c8c2; }

      .tabs { display: flex; gap: 8px; padding: 12px 20px 0; flex-wrap: wrap; }
      .tab {
        padding: 7px 16px; border: 1px solid var(--line); border-bottom: none;
        border-radius: 8px 8px 0 0; background: #e7ecf8; cursor: pointer; font-weight: 600;
      }
      .tab.active { background: #fff; color: var(--bar-a); box-shadow: 0 -2px 0 var(--gold) inset; }
      .tab .n { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }

      main { padding: 0 20px 40px; }
      .panel { background: #fff; border-radius: 0 8px 8px 8px; box-shadow: 0 2px 12px rgba(43, 53, 102, .12); overflow: hidden; }
      .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
      .bar .info { color: var(--muted); font-size: 12px; }
      .bar .grow { flex: 1; }

      .wrap { overflow: auto; max-height: calc(100vh - 260px); }
      table { border-collapse: collapse; width: 100%; min-width: 1100px; }
      th, td { border: 1px solid var(--line); padding: 0; }
      th {
        position: sticky; top: 0; z-index: 2; background: var(--bar-b); color: #fff;
        font-weight: 700; font-size: 13px; padding: 9px 8px; white-space: nowrap;
      }
      th .sub { display: block; font-weight: 400; font-size: 11px; color: #c9d3ef; }
      td.rowno { text-align: center; color: var(--muted); font-size: 12px; background: var(--row); padding: 0 6px; white-space: nowrap; }
      td.seq { text-align: center; background: var(--row); color: #4b5680; font-weight: 700; }
      tbody tr:nth-child(even) td { background: var(--row-alt); }
      tbody tr:nth-child(even) td.rowno, tbody tr:nth-child(even) td.seq { background: var(--row); }
      tbody tr:hover td { background: #fdf6e6; }

      td input, td select {
        width: 100%; border: none; background: transparent; font: inherit; color: inherit;
        padding: 8px; outline: none;
      }
      td input:focus, td select:focus { background: #fff8e6; box-shadow: 0 0 0 2px var(--gold) inset; }
      td select { cursor: pointer; }
      td.edited input, td.edited select { background: #fff4d6; }
      td.actions { text-align: center; background: var(--row); }

      .empty { padding: 24px; text-align: center; color: var(--muted); }

      #toast {
        position: fixed; right: 20px; bottom: 20px; max-width: 360px; display: flex; flex-direction: column; gap: 8px;
      }
      .note {
        padding: 10px 14px; border-radius: 8px; color: #fff; background: #33406e;
        box-shadow: 0 6px 18px rgba(20, 26, 50, .3); font-size: 13px;
      }
      .note.ok { background: #2e7d52; }
      .note.err { background: #a53c2e; }
    </style>
  </head>
  <body>
    <header>
      <h1>排队表 · 本地编辑器</h1>
      <div class="meta" id="meta">加载中…</div>
      <div class="grow"></div>
      <a class="online" id="online" href="#" target="_blank" rel="noreferrer">腾讯文档在线版 ↗</a>
      <button class="ghost" id="reload">重新读取</button>
      <button class="primary" id="save">保存改动</button>
    </header>

    <div class="tabs" id="tabs"></div>

    <main>
      <div class="panel">
        <div class="bar">
          <button id="addRow">新增一行</button>
          <span class="grow"></span>
          <span class="info" id="hint"></span>
        </div>
        <div class="wrap"><div id="grid"></div></div>
      </div>
    </main>

    <div id="toast"></div>

    <script>
      const TOAST = document.getElementById('toast')
      const note = (msg, kind = '') => {
        const el = document.createElement('div')
        el.className = 'note ' + kind
        el.textContent = msg
        TOAST.appendChild(el)
        setTimeout(() => el.remove(), kind === 'err' ? 8000 : 3500)
      }

      /** edited: row → { field: value }；newRows: 本地新增、保存时由后端分配行号 */
      let data = null
      let current = 0
      let edited = new Map()
      let newRows = []

      const sheet = () => data.sheets[current]
      const editableFields = () => data.fields.filter(f => f.editable)


      const isBlank = values => editableFields().every(f => !String(values[f.key] ?? '').trim())

      function renderTabs() {
        const box = document.getElementById('tabs')
        box.innerHTML = ''
        data.sheets.forEach((s, i) => {
          const el = document.createElement('div')
          el.className = 'tab' + (i === current ? ' active' : '')
          el.innerHTML = s.name + '<span class="n">' + s.rows.length + ' 人</span>'
          el.onclick = () => { current = i; renderTabs(); renderGrid() }
          box.appendChild(el)
        })
      }

      function cellInput(s, row, field, value) {
        const td = document.createElement('td')
        const opts = s.options?.[field.option] ?? []
        let el
        if (opts.length) {
          el = document.createElement('select')
          const blank = document.createElement('option')
          blank.value = ''
          blank.textContent = '（空）'
          el.appendChild(blank)
          const list = new Set(opts)
          if (value && !list.has(value)) list.add(value)
          for (const o of list) {
            const op = document.createElement('option')
            op.value = o
            op.textContent = o
            if (o === value) op.selected = true
            el.appendChild(op)
          }
        } else {
          el = document.createElement('input')
          el.type = 'text'
          el.value = value ?? ''
          el.placeholder = field.key === 'nickname' ? '群昵称（必填）' : ''
        }
        el.onchange = () => {
          const v = el.value
          const m = edited.get(row) ?? {}
          m[field.key] = v
          edited.set(row, m)
          td.classList.toggle('edited', true)
        }
        td.appendChild(el)
        return td
      }

      function renderGrid() {
        const s = sheet()
        const grid = document.getElementById('grid')
        grid.innerHTML = ''

        if (!s.rows.length && !newRows.length) {
          grid.innerHTML = '<div class="empty">这个榜还没有数据行，点「新增一行」开始录入。</div>'
          document.getElementById('hint').textContent = ''
          return
        }

        const table = document.createElement('table')
        const thead = document.createElement('thead')
        const hr = document.createElement('tr')
        hr.innerHTML = '<th style="width:56px">行<span class="sub">表格行号</span></th>'
        for (const f of data.fields)
          hr.innerHTML += '<th>' + f.label + '<span class="sub">' + (f.editable ? '可编辑' : '公式只读') + '</span></th>'
        hr.innerHTML += '<th style="width:64px">操作</th>'
        thead.appendChild(hr)
        table.appendChild(thead)

        const tbody = document.createElement('tbody')
        const all = [...s.rows.map(r => ({ ...r, __tmp: false })), ...newRows]
        for (const r of all) {
          const tr = document.createElement('tr')
          const values = { ...r, ...(edited.get(r.row) ?? {}) }
          const tdNo = document.createElement('td')
          tdNo.className = 'rowno'
          tdNo.textContent = r.__tmp ? `新 → 第 ${r.row} 行` : r.row
          tr.appendChild(tdNo)

          /** seq 是公式列，只读展示 */
          tr.appendChild(Object.assign(document.createElement('td'), { className: 'seq', textContent: values.seq || '' }))
          for (const f of data.fields) {
            if (!f.editable) continue
            tr.appendChild(cellInput(s, r.row, f, values[f.key]))
          }
          const tda = document.createElement('td')
          tda.className = 'actions'
          const del = document.createElement('button')
          del.className = 'danger'
          del.textContent = '清空'
          del.onclick = () => {
            if (r.__tmp) newRows = newRows.filter(x => x.row !== r.row)
            else edited.set(r.row, Object.fromEntries(editableFields().map(f => [f.key, ''])))
            renderGrid()
          }
          tda.appendChild(del)
          tr.appendChild(tda)
          tbody.appendChild(tr)
        }
        table.appendChild(tbody)
        grid.appendChild(table)

        const changed = [...edited.entries()].filter(([, v]) => !isBlank(v)).length
        document.getElementById('hint').textContent =
          `共 ${s.rows.length} 行 · 待保存 ${changed + newRows.length} 项 · 表头第 ${s.headerRow} 行，数据区 ${s.dataStart}–${s.dataEnd}`
      }

      async function load() {
        const res = await fetch('/api/data')
        data = await res.json()
        edited = new Map()
        newRows = []
        document.getElementById('meta').textContent = data.file + ' · 上次保存 ' + data.savedAt
        document.getElementById('online').href = data.online
        renderTabs()
        renderGrid()
      }

      document.getElementById('reload').onclick = () => load().then(() => note('已重新读取表格', 'ok'))

      document.getElementById('addRow').onclick = () => {
        const s = sheet()
        /** 直接定下真实行号：优先数据区内的空行，否则顺延到数据区之后（与插件写表口径一致） */
        const used = new Set([...s.rows.map(r => r.row), ...newRows.map(r => r.row)])
        let row = 0
        for (let r = s.dataStart; r <= s.dataEnd; r++) if (!used.has(r)) { row = r; break }
        if (!row) {
          row = s.dataEnd + 1
          while (used.has(row)) row++
        }
        const base = { row, seq: "" }
        for (const f of editableFields()) base[f.key] = ""
        newRows.push(base)
        renderGrid()
      }

      document.getElementById('save').onclick = async () => {
        const s = sheet()
        const rows = []
        for (const r of s.rows) {
          const v = edited.get(r.row)
          if (v) rows.push({ row: r.row, values: v })
        }
        for (const r of newRows) rows.push({ row: 0, values: r })
        if (!rows.length) return note('没有改动需要保存')

        const btn = document.getElementById('save')
        btn.disabled = true
        try {
          const res = await fetch('/api/save', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ sheet: s.name, rows }),
          })
          const out = await res.json()
          if (!out.ok) throw new Error(out.error || '保存失败')
          note(`保存成功：写入 ${out.written ?? 0} 行、清空 ${out.cleared ?? 0} 行（已备份 .bak）`, 'ok')
          await load()
        } catch (err) {
          note('保存失败：' + err.message, 'err')
        } finally {
          btn.disabled = false
        }
      }

      load().catch(err => note('读取失败：' + err.message, 'err'))
    </script>
  </body>
</html>
